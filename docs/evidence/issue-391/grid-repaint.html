<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Safari Grid repaint reproduction — #391</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 24px; padding-top: 300px; font: 15px/24px Arial, sans-serif; }
  .actions { height: 52px; display: grid; place-items: center; }
  .flex { display: flex; align-items: center; justify-content: center; }
  .progress { width: 22px; height: 22px; border: 2px solid #ccc; border-radius: 50%; }
  .button { display: flex; align-items: center; justify-content: center; width: 100%; min-height: 52px; padding: 12px 16px; border: 1px solid transparent; border-radius: 10px; background: #087eaf; color: white; text-decoration: none; }
</style>
<div class="actions"><span class="progress" aria-hidden="true"></span></div>
<script>
  const actions = document.querySelector('.actions');
  if (new URL(location.href).searchParams.get('layout') === 'flex') actions.classList.add('flex');
  setTimeout(() => {
    const next = document.createElement('template');
    next.innerHTML = '<a class="button" href="#">Открыть бота</a>';
    actions.replaceChildren(...next.content.childNodes);
  }, 3000);
</script>
</html>
