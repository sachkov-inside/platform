<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Сборка шортса: было и стало</title>
<style>
  :root { --bg: #ffffff; --ink: #15181c; --muted: #56606b; --was: #eef0f3; --now: #e5f5ec; --ok: #17713f; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #171b21; --ink: #e7eaed; --muted: #a0a9b3; --was: #20262e; --now: #12301f; --ok: #6fcf97; }
  }
  body { margin: 0; padding: 4px 0; background: var(--bg); color: var(--ink);
         font: 1rem/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; }
  h2 { font-size: 1.125rem; margin: 0 0 8px; }
  p { margin: 0 0 16px; max-width: 34rem; }
  svg { display: block; max-width: 100%; height: auto; }
  text { fill: var(--ink); font-size: 14px; font-family: inherit; }
  .head { font-weight: 600; font-size: 13px; }
  .sub { fill: var(--muted); font-size: 12px; }
  .was rect { fill: var(--was); }
  .now rect { fill: var(--now); }
  .arrow { fill: none; stroke: var(--muted); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .time { fill: var(--ok); font-weight: 600; }
</style>
</head>
<body>
<h2>Почему сборка стала быстрее</h2>
<p>Раньше субтитры строились по готовому ролику, и монтаж шёл дважды. Теперь субтитры строятся
по исходной записи, а монтаж идёт один раз.</p>
<svg viewBox="0 0 640 230" width="640" height="230" role="img" aria-labelledby="t d">
  <title id="t">Сборка шортса: было и стало</title>
  <desc id="d">Было: монтаж, затем субтитры по готовому ролику, затем повторный монтаж; 11 минут.
  Стало: субтитры по исходной записи, затем один монтаж; 4 минуты.</desc>
  <text class="head" x="0" y="14">Было: три скрипта</text>
  <g class="was">
    <rect x="0" y="26" width="180" height="44" rx="10"/><text x="14" y="53">Монтаж</text>
    <rect x="220" y="26" width="180" height="44" rx="10"/><text x="234" y="53">Субтитры по ролику</text>
    <rect x="440" y="26" width="180" height="44" rx="10"/><text x="454" y="53">Монтаж ещё раз</text>
  </g>
  <path class="arrow" d="M184 48h30M208 43l6 5-6 5M404 48h30M428 43l6 5-6 5"/>
  <text class="sub" x="0" y="92">11 минут</text>

  <text class="head" x="0" y="140">Стало: один сценарий make-short</text>
  <g class="now">
    <rect x="0" y="152" width="180" height="44" rx="10"/><text x="14" y="179">Субтитры по записи</text>
    <rect x="220" y="152" width="180" height="44" rx="10"/><text x="234" y="179">Монтаж</text>
  </g>
  <path class="arrow" d="M184 174h30M208 169l6 5-6 5"/>
  <text class="time" x="0" y="218">4 минуты</text>
</svg>
</body>
</html>
