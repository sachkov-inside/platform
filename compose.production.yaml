name: ${PLATFORM_COMPOSE_PROJECT:-inside-platform-production}

services:
  postgres:
    image: postgres:18.4-alpine3.23
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:?Set POSTGRES_USER} -d ${POSTGRES_DB:?Set POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - data
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql

  database-roles:
    image: postgres:18.4-alpine3.23
    command: ["sh", "/usr/local/bin/provision-production-database-roles.sh", "migration"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      MIGRATION_DATABASE_USER: ${MIGRATION_DATABASE_USER:?Set MIGRATION_DATABASE_USER}
      MIGRATION_DATABASE_PASSWORD: ${MIGRATION_DATABASE_PASSWORD:?Set MIGRATION_DATABASE_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - data
    restart: "no"
    volumes:
      - ./scripts/provision-production-database-roles.sh:/usr/local/bin/provision-production-database-roles.sh:ro

  migrations:
    image: ${PLATFORM_MIGRATION_IMAGE_REPOSITORY:?Set PLATFORM_MIGRATION_IMAGE_REPOSITORY}@sha256:${PLATFORM_MIGRATION_IMAGE_DIGEST:?Set PLATFORM_MIGRATION_IMAGE_DIGEST}
    command: ["node", "dist/migrations/migrate.js"]
    environment:
      NODE_ENV: production
      DATABASE_URL: ${MIGRATION_DATABASE_URL:?Set MIGRATION_DATABASE_URL}
    depends_on:
      database-roles:
        condition: service_completed_successfully
    networks:
      - data
    restart: "no"

  database-access:
    image: postgres:18.4-alpine3.23
    command: ["sh", "/usr/local/bin/provision-production-database-roles.sh", "application"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      MIGRATION_DATABASE_USER: ${MIGRATION_DATABASE_USER:?Set MIGRATION_DATABASE_USER}
      APPLICATION_DATABASE_USER: ${APPLICATION_DATABASE_USER:?Set APPLICATION_DATABASE_USER}
      APPLICATION_DATABASE_PASSWORD: ${APPLICATION_DATABASE_PASSWORD:?Set APPLICATION_DATABASE_PASSWORD}
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL:?Set MIGRATION_DATABASE_URL}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      RELEASE_MIGRATION_IMAGE_DIGEST: ${PLATFORM_MIGRATION_IMAGE_DIGEST:?Set PLATFORM_MIGRATION_IMAGE_DIGEST}
    depends_on:
      migrations:
        condition: service_completed_successfully
    networks:
      - data
    restart: "no"
    volumes:
      - ./scripts/provision-production-database-roles.sh:/usr/local/bin/provision-production-database-roles.sh:ro

  api:
    image: ${PLATFORM_API_IMAGE_REPOSITORY:?Set PLATFORM_API_IMAGE_REPOSITORY}@sha256:${PLATFORM_API_IMAGE_DIGEST:?Set PLATFORM_API_IMAGE_DIGEST}
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      API_HOST: 0.0.0.0
      API_PORT: "3001"
      LOGTO_ISSUER: ${LOGTO_ISSUER:?Set LOGTO_ISSUER}
      LOGTO_AUDIENCE: ${LOGTO_AUDIENCE:?Set LOGTO_AUDIENCE}
      LOGTO_JWKS_URL: ${LOGTO_JWKS_URL:?Set LOGTO_JWKS_URL}
      IDENTITY_EMAIL_FINGERPRINT_KEY: ${IDENTITY_EMAIL_FINGERPRINT_KEY:?Set IDENTITY_EMAIL_FINGERPRINT_KEY}
      MEMBERSHIP_ACQUISITION_URL: ${MEMBERSHIP_ACQUISITION_URL:?Set MEMBERSHIP_ACQUISITION_URL}
      TELEGRAM_BOT_START_URL: ${TELEGRAM_BOT_START_URL:?Set TELEGRAM_BOT_START_URL}
      TELEGRAM_LINKING_ENDPOINT: ${TELEGRAM_LINKING_ENDPOINT:?Set TELEGRAM_LINKING_ENDPOINT}
      TELEGRAM_LINKING_SECRET: ${TELEGRAM_LINKING_SECRET:?Set TELEGRAM_LINKING_SECRET}
      TELEGRAM_EVIDENCE_INGRESS_SECRET: ${TELEGRAM_EVIDENCE_INGRESS_SECRET:?Set TELEGRAM_EVIDENCE_INGRESS_SECRET}
      TELEGRAM_LINK_LIFETIME_SECONDS: ${TELEGRAM_LINK_LIFETIME_SECONDS:-300}
      OBJECT_STORAGE_ENDPOINT: ${OBJECT_STORAGE_ENDPOINT:?Set OBJECT_STORAGE_ENDPOINT}
      OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:?Set OBJECT_STORAGE_REGION}
      OBJECT_STORAGE_ACCESS_KEY_ID: ${OBJECT_STORAGE_ACCESS_KEY_ID:?Set OBJECT_STORAGE_ACCESS_KEY_ID}
      OBJECT_STORAGE_SECRET_ACCESS_KEY: ${OBJECT_STORAGE_SECRET_ACCESS_KEY:?Set OBJECT_STORAGE_SECRET_ACCESS_KEY}
      OBJECT_STORAGE_PUBLIC_BUCKET: ${OBJECT_STORAGE_PUBLIC_BUCKET:?Set OBJECT_STORAGE_PUBLIC_BUCKET}
      OBJECT_STORAGE_PROTECTED_BUCKET: ${OBJECT_STORAGE_PROTECTED_BUCKET:?Set OBJECT_STORAGE_PROTECTED_BUCKET}
      OBJECT_STORAGE_QUARANTINE_BUCKET: ${OBJECT_STORAGE_QUARANTINE_BUCKET:?Set OBJECT_STORAGE_QUARANTINE_BUCKET}
      OBJECT_STORAGE_SIGNED_GET_TTL_SECONDS: ${OBJECT_STORAGE_SIGNED_GET_TTL_SECONDS:-60}
      MATERIAL_ASSET_ORPHAN_GRACE_SECONDS: ${MATERIAL_ASSET_ORPHAN_GRACE_SECONDS:-86400}
    depends_on:
      database-access:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
    init: true
    networks:
      - application
      - data
    restart: unless-stopped
    stop_grace_period: 10s

  material-assets-worker:
    image: ${PLATFORM_API_IMAGE_REPOSITORY:?Set PLATFORM_API_IMAGE_REPOSITORY}@sha256:${PLATFORM_API_IMAGE_DIGEST:?Set PLATFORM_API_IMAGE_DIGEST}
    command: ["node", "dist/entrypoints/material-assets-worker.js"]
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      API_HOST: 0.0.0.0
      API_PORT: "3001"
      LOGTO_ISSUER: ${LOGTO_ISSUER:?Set LOGTO_ISSUER}
      LOGTO_AUDIENCE: ${LOGTO_AUDIENCE:?Set LOGTO_AUDIENCE}
      LOGTO_JWKS_URL: ${LOGTO_JWKS_URL:?Set LOGTO_JWKS_URL}
      IDENTITY_EMAIL_FINGERPRINT_KEY: ${IDENTITY_EMAIL_FINGERPRINT_KEY:?Set IDENTITY_EMAIL_FINGERPRINT_KEY}
      MEMBERSHIP_ACQUISITION_URL: ${MEMBERSHIP_ACQUISITION_URL:?Set MEMBERSHIP_ACQUISITION_URL}
      TELEGRAM_BOT_START_URL: ${TELEGRAM_BOT_START_URL:?Set TELEGRAM_BOT_START_URL}
      TELEGRAM_LINKING_ENDPOINT: ${TELEGRAM_LINKING_ENDPOINT:?Set TELEGRAM_LINKING_ENDPOINT}
      TELEGRAM_LINKING_SECRET: ${TELEGRAM_LINKING_SECRET:?Set TELEGRAM_LINKING_SECRET}
      TELEGRAM_EVIDENCE_INGRESS_SECRET: ${TELEGRAM_EVIDENCE_INGRESS_SECRET:?Set TELEGRAM_EVIDENCE_INGRESS_SECRET}
      TELEGRAM_LINK_LIFETIME_SECONDS: ${TELEGRAM_LINK_LIFETIME_SECONDS:-300}
      OBJECT_STORAGE_ENDPOINT: ${OBJECT_STORAGE_ENDPOINT:?Set OBJECT_STORAGE_ENDPOINT}
      OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:?Set OBJECT_STORAGE_REGION}
      OBJECT_STORAGE_ACCESS_KEY_ID: ${OBJECT_STORAGE_ACCESS_KEY_ID:?Set OBJECT_STORAGE_ACCESS_KEY_ID}
      OBJECT_STORAGE_SECRET_ACCESS_KEY: ${OBJECT_STORAGE_SECRET_ACCESS_KEY:?Set OBJECT_STORAGE_SECRET_ACCESS_KEY}
      OBJECT_STORAGE_PUBLIC_BUCKET: ${OBJECT_STORAGE_PUBLIC_BUCKET:?Set OBJECT_STORAGE_PUBLIC_BUCKET}
      OBJECT_STORAGE_PROTECTED_BUCKET: ${OBJECT_STORAGE_PROTECTED_BUCKET:?Set OBJECT_STORAGE_PROTECTED_BUCKET}
      OBJECT_STORAGE_QUARANTINE_BUCKET: ${OBJECT_STORAGE_QUARANTINE_BUCKET:?Set OBJECT_STORAGE_QUARANTINE_BUCKET}
      OBJECT_STORAGE_SIGNED_GET_TTL_SECONDS: ${OBJECT_STORAGE_SIGNED_GET_TTL_SECONDS:-60}
      MATERIAL_ASSET_ORPHAN_GRACE_SECONDS: ${MATERIAL_ASSET_ORPHAN_GRACE_SECONDS:-86400}
    depends_on:
      database-access:
        condition: service_completed_successfully
    init: true
    networks:
      - data
    restart: unless-stopped
    stop_grace_period: 10s

  web:
    image: ${PLATFORM_WEB_IMAGE_REPOSITORY:?Set PLATFORM_WEB_IMAGE_REPOSITORY}@sha256:${PLATFORM_WEB_IMAGE_DIGEST:?Set PLATFORM_WEB_IMAGE_DIGEST}
    environment:
      NODE_ENV: production
      BACKEND_BASE_URL: http://api:3001
      LOGTO_ENDPOINT: ${LOGTO_ENDPOINT:?Set LOGTO_ENDPOINT}
      LOGTO_AUDIENCE: ${LOGTO_AUDIENCE:?Set LOGTO_AUDIENCE}
      LOGTO_APP_ID: ${LOGTO_APP_ID:?Set LOGTO_APP_ID}
      LOGTO_APP_SECRET: ${LOGTO_APP_SECRET:?Set LOGTO_APP_SECRET}
      LOGTO_COOKIE_SECRET: ${LOGTO_COOKIE_SECRET:?Set LOGTO_COOKIE_SECRET}
      WEB_BASE_URL: ${WEB_BASE_URL:?Set WEB_BASE_URL}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 18
    init: true
    networks:
      - application
      - edge
    restart: unless-stopped
    stop_grace_period: 10s

  caddy:
    image: caddy:2.11.4-alpine
    environment:
      PLATFORM_DOMAIN: ${PLATFORM_DOMAIN:?Set PLATFORM_DOMAIN}
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "${PLATFORM_HTTP_PORT:-80}:80"
      - "${PLATFORM_HTTPS_PORT:-443}:443"
    networks:
      - edge
    restart: unless-stopped
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

networks:
  application:
  data:
    internal: true
  edge:

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
