name: ${PLATFORM_COMPOSE_PROJECT:-inside-platform-production}

services:
  postgres:
    image: postgres:18.4-alpine3.23
    env_file:
      - ${PLATFORM_CONFIG_DIR:-./config/compose/production}/postgres.env
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql

  migrations:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      target: api-production
    command: ["node", "dist/migrations/migrate.js"]
    env_file:
      - ${PLATFORM_CONFIG_DIR:-./config/compose/production}/migrations.env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      target: api-production
    env_file:
      - ${PLATFORM_CONFIG_DIR:-./config/compose/production}/api.env
    depends_on:
      migrations:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
    init: true
    restart: unless-stopped
    stop_grace_period: 10s

  profile-avatars-worker:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      target: api-production
    command: ["node", "dist/entrypoints/profile-avatars-worker.js"]
    env_file:
      - ${PLATFORM_CONFIG_DIR:-./config/compose/production}/profile-avatars-worker.env
    depends_on:
      migrations:
        condition: service_completed_successfully
    init: true
    restart: unless-stopped
    stop_grace_period: 10s

  video-deletions-worker:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      target: api-production
    command: ["node", "dist/entrypoints/video-deletions-worker.js"]
    env_file:
      - ${PLATFORM_CONFIG_DIR:-./config/compose/production}/video-deletions-worker.env
    depends_on:
      migrations:
        condition: service_completed_successfully
    init: true
    restart: unless-stopped
    stop_grace_period: 10s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: web-production
    env_file:
      - ${PLATFORM_CONFIG_DIR:-./config/compose/production}/web.env
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 18
    init: true
    restart: unless-stopped
    stop_grace_period: 10s

  caddy:
    image: caddy:2.11.4-alpine
    env_file:
      - ${PLATFORM_CONFIG_DIR:-./config/compose/production}/caddy.env
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "${PLATFORM_HTTP_PORT:-80}:80"
      - "${PLATFORM_HTTPS_PORT:-443}:443"
    restart: unless-stopped
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
