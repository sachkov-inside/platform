name: ${PLATFORM_COMPOSE_PROJECT:-inside-platform-production}

services:
  postgres:
    image: postgres:18.4-alpine3.23@sha256:996d0920e4ff9df1fc19dacb904492f3c1ec0ec1cc338f0ad7123be7731c5f5e
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:?Set POSTGRES_USER} -d ${POSTGRES_DB:?Set POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql

  migrations:
    image: ${PLATFORM_API_IMAGE:?Set PLATFORM_API_IMAGE to an immutable image reference}
    command: ["node", "dist/migrations/migrate.js"]
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    image: ${PLATFORM_API_IMAGE:?Set PLATFORM_API_IMAGE to an immutable image reference}
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      API_HOST: 0.0.0.0
      API_PORT: "3001"
      LOGTO_ISSUER: ${LOGTO_ISSUER:?Set LOGTO_ISSUER}
      LOGTO_AUDIENCE: ${LOGTO_AUDIENCE:?Set LOGTO_AUDIENCE}
      LOGTO_JWKS_URL: ${LOGTO_JWKS_URL:?Set LOGTO_JWKS_URL}
      IDENTITY_EMAIL_FINGERPRINT_KEY: ${IDENTITY_EMAIL_FINGERPRINT_KEY:?Set IDENTITY_EMAIL_FINGERPRINT_KEY}
      MEMBERSHIP_ACQUISITION_URL: ${MEMBERSHIP_ACQUISITION_URL:?Set MEMBERSHIP_ACQUISITION_URL}
    depends_on:
      postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
    init: true
    restart: unless-stopped
    stop_grace_period: 10s

  web:
    image: ${PLATFORM_WEB_IMAGE:?Set PLATFORM_WEB_IMAGE to an immutable image reference}
    environment:
      NODE_ENV: production
      BACKEND_BASE_URL: http://api:3001
      LOGTO_ENDPOINT: ${LOGTO_ENDPOINT:?Set LOGTO_ENDPOINT}
      LOGTO_AUDIENCE: ${LOGTO_AUDIENCE:?Set LOGTO_AUDIENCE}
      LOGTO_APP_ID: ${LOGTO_APP_ID:?Set LOGTO_APP_ID}
      LOGTO_APP_SECRET: ${LOGTO_APP_SECRET:?Set LOGTO_APP_SECRET}
      LOGTO_COOKIE_SECRET: ${LOGTO_COOKIE_SECRET:?Set LOGTO_COOKIE_SECRET}
      WEB_BASE_URL: ${WEB_BASE_URL:?Set WEB_BASE_URL}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 18
    init: true
    restart: unless-stopped
    stop_grace_period: 10s

  caddy:
    image: caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    environment:
      PLATFORM_DOMAIN: ${PLATFORM_DOMAIN:?Set PLATFORM_DOMAIN}
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "${PLATFORM_HTTP_PORT:-80}:80"
      - "${PLATFORM_HTTPS_PORT:-443}:443"
    restart: unless-stopped
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
