name: ${PLATFORM_COMPOSE_PROJECT:?PLATFORM_COMPOSE_PROJECT is required}

# Процессы приложения не нуждаются в привилегиях ядра и пишут только маркер готовности воркера в
# `/tmp`. Пределы памяти и процессов — предохранитель от утечки или fork в одном процессе, а не
# бюджет: в покое процесс занимает около 250 MiB (docs/runbooks/production-release.md).
x-backend-runtime: &backend-runtime
  image: ${PLATFORM_BACKEND_IMAGE_REPOSITORY:?backend repository is required}@sha256:${PLATFORM_BACKEND_IMAGE_DIGEST:?backend sha256 digest is required}
  pull_policy: never
  init: true
  cap_drop: [ALL]
  mem_limit: 512m
  pids_limit: 256
  read_only: true
  security_opt: [no-new-privileges:true]
  tmpfs: [/tmp]

x-worker-healthcheck: &worker-healthcheck
  test:
    - CMD
    - node
    - dist/infrastructure/worker-healthcheck.js
  interval: 5s
  timeout: 3s
  retries: 12
  start_period: 10s

services:
  # Свой брокер окружения. Он переживает выпуски приложения: deploy его не останавливает, а данные
  # лежат в именованном томе. Наружу не публикуется ничего; notifications-worker и Telegram
  # подключаются по AMQPS через внутреннюю сеть `broker`.
  rabbitmq:
    image: rabbitmq:4.2.4-alpine@sha256:83522278ca69414e4895b3ea3c0f943c63ad316c063f9cda9c32fd42fe800f47
    pull_policy: missing
    hostname: rabbitmq
    # Сразу пользователь образа: healthcheck и rabbitmqctl не создают erlang cookie от root раньше
    # сервера, а TLS-ключ и определения читаются по группе 101.
    user: rabbitmq
    configs:
      - source: rabbitmq-conf
        target: /etc/rabbitmq/rabbitmq.conf
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_listener", "5671"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 30s
    cap_drop: [ALL]
    mem_limit: 768m
    pids_limit: 512
    networks: [broker]
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    stop_grace_period: 60s
    volumes:
      - broker-data:/var/lib/rabbitmq
      # Server-owned: TLS сервера и определения окружения с хэшами паролей. Читает только брокер.
      - ${PLATFORM_CONFIG_DIR:?PLATFORM_CONFIG_DIR is required}/rabbitmq:/etc/inside/broker:ro

  migrations:
    <<: *backend-runtime
    command: ["node", "dist/migrations/migrate.js"]
    env_file:
      - ${PLATFORM_RELEASE_ENV_FILE:?PLATFORM_RELEASE_ENV_FILE is required}
      - ${PLATFORM_CONFIG_DIR:?PLATFORM_CONFIG_DIR is required}/migrations.env
    networks: [database]
    restart: "no"

  api:
    <<: *backend-runtime
    command: ["node", "dist/entrypoints/api.js"]
    env_file:
      - ${PLATFORM_RELEASE_ENV_FILE:?PLATFORM_RELEASE_ENV_FILE is required}
      - ${PLATFORM_CONFIG_DIR:?PLATFORM_CONFIG_DIR is required}/api.env
    depends_on:
      migrations:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - healthcheck/http-healthcheck.mjs
        - api
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks: [edge, application, database]
    ports:
      - "127.0.0.1:${PLATFORM_API_LOOPBACK_PORT:?PLATFORM_API_LOOPBACK_PORT is required}:3001"
    restart: unless-stopped
    stop_grace_period: 15s

  mcp:
    <<: *backend-runtime
    command: ["node", "dist/entrypoints/mcp.js"]
    env_file:
      - ${PLATFORM_RELEASE_ENV_FILE:?PLATFORM_RELEASE_ENV_FILE is required}
      - ${PLATFORM_CONFIG_DIR:?PLATFORM_CONFIG_DIR is required}/mcp.env
    depends_on:
      migrations:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - healthcheck/http-healthcheck.mjs
        - mcp
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks: [edge, application, database]
    ports:
      - "127.0.0.1:${PLATFORM_MCP_LOOPBACK_PORT:?PLATFORM_MCP_LOOPBACK_PORT is required}:3002"
    restart: unless-stopped
    stop_grace_period: 15s

  material-assets-worker:
    <<: *backend-runtime
    # Декодирует загруженные изображения до ограничения sharp по пикселям; нужен запас сверх покоя.
    mem_limit: 768m
    command: ["node", "dist/entrypoints/material-assets-worker.js"]
    env_file:
      - ${PLATFORM_RELEASE_ENV_FILE:?PLATFORM_RELEASE_ENV_FILE is required}
      - ${PLATFORM_CONFIG_DIR:?PLATFORM_CONFIG_DIR is required}/material-assets-worker.env
    depends_on:
      migrations:
        condition: service_completed_successfully
    healthcheck: *worker-healthcheck
    networks: [edge, application, database]
    restart: unless-stopped
    stop_grace_period: 20s

  profile-avatars-worker:
    <<: *backend-runtime
    command: ["node", "dist/entrypoints/profile-avatars-worker.js"]
    env_file:
      - ${PLATFORM_RELEASE_ENV_FILE:?PLATFORM_RELEASE_ENV_FILE is required}
      - ${PLATFORM_CONFIG_DIR:?PLATFORM_CONFIG_DIR is required}/profile-avatars-worker.env
    depends_on:
      migrations:
        condition: service_completed_successfully
    healthcheck: *worker-healthcheck
    networks: [edge, application, database]
    restart: unless-stopped
    stop_grace_period: 20s

  video-deletions-worker:
    <<: *backend-runtime
    command: ["node", "dist/entrypoints/video-deletions-worker.js"]
    env_file:
      - ${PLATFORM_RELEASE_ENV_FILE:?PLATFORM_RELEASE_ENV_FILE is required}
      - ${PLATFORM_CONFIG_DIR:?PLATFORM_CONFIG_DIR is required}/video-deletions-worker.env
    depends_on:
      migrations:
        condition: service_completed_successfully
    healthcheck: *worker-healthcheck
    networks: [edge, application, database]
    restart: unless-stopped
    stop_grace_period: 20s

  # Сверка и продление оплаты, возвраты, Tribute и доставка права на сообщество. Выходит в банк и
  # Telegram через `edge`.
  billing-worker:
    <<: *backend-runtime
    command: ["node", "dist/entrypoints/billing-worker.js"]
    env_file:
      - ${PLATFORM_RELEASE_ENV_FILE:?PLATFORM_RELEASE_ENV_FILE is required}
      - ${PLATFORM_CONFIG_DIR:?PLATFORM_CONFIG_DIR is required}/billing-worker.env
    depends_on:
      migrations:
        condition: service_completed_successfully
    healthcheck: *worker-healthcheck
    networks: [edge, application, database]
    restart: unless-stopped
    stop_grace_period: 20s

  # Письма и команды Telegram из outbox через брокер. Доверяет только CA брокера окружения.
  notifications-worker:
    <<: *backend-runtime
    command: ["node", "dist/entrypoints/notifications-worker.js"]
    env_file:
      - ${PLATFORM_RELEASE_ENV_FILE:?PLATFORM_RELEASE_ENV_FILE is required}
      - ${PLATFORM_CONFIG_DIR:?PLATFORM_CONFIG_DIR is required}/notifications-worker.env
    depends_on:
      migrations:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    healthcheck: *worker-healthcheck
    networks: [edge, application, database, broker]
    restart: unless-stopped
    stop_grace_period: 20s
    volumes:
      - ${PLATFORM_CONFIG_DIR:?PLATFORM_CONFIG_DIR is required}/rabbitmq/tls/ca.pem:/etc/inside/broker-ca.pem:ro

  web:
    image: ${PLATFORM_WEB_IMAGE_REPOSITORY:?web repository is required}@sha256:${PLATFORM_WEB_IMAGE_DIGEST:?web sha256 digest is required}
    pull_policy: never
    env_file:
      - ${PLATFORM_RELEASE_ENV_FILE:?PLATFORM_RELEASE_ENV_FILE is required}
      - ${PLATFORM_CONFIG_DIR:?PLATFORM_CONFIG_DIR is required}/web.env
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - apps/web/healthcheck/http-healthcheck.mjs
        - web
      interval: 5s
      timeout: 5s
      retries: 18
      start_period: 10s
    init: true
    cap_drop: [ALL]
    mem_limit: 512m
    pids_limit: 256
    networks: [edge, application]
    ports:
      - "127.0.0.1:${PLATFORM_WEB_LOOPBACK_PORT:?PLATFORM_WEB_LOOPBACK_PORT is required}:3000"
    # Без read_only: Next сохраняет пересобранные страницы кеша в каталог сборки приложения.
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    stop_grace_period: 15s

networks:
  edge:
    name: ${PLATFORM_EDGE_NETWORK:?PLATFORM_EDGE_NETWORK is required}
  application:
    internal: true
    name: ${PLATFORM_APPLICATION_NETWORK:?PLATFORM_APPLICATION_NETWORK is required}
  database:
    external: true
    name: ${FOUNDATION_DATABASE_NETWORK:?FOUNDATION_DATABASE_NETWORK is required}
  # Telegram подключает свой процесс к этой сети как external и обращается к брокеру по имени `rabbitmq`.
  broker:
    internal: true
    name: ${PLATFORM_BROKER_NETWORK:?PLATFORM_BROKER_NETWORK is required}

volumes:
  broker-data:

configs:
  # Один AMQPS-слушатель, TLS только сервера (клиенты входят паролем своего principal), топология
  # из определений при запуске. Пределы памяти и диска рассчитаны на общий VPS: 2 CPU, 3,9 GiB.
  rabbitmq-conf:
    content: |
      listeners.tcp = none
      listeners.ssl.default = 5671
      ssl_options.cacertfile = /etc/inside/broker/tls/ca.pem
      ssl_options.certfile = /etc/inside/broker/tls/server.pem
      ssl_options.keyfile = /etc/inside/broker/tls/server-key.pem
      ssl_options.verify = verify_none
      ssl_options.fail_if_no_peer_cert = false
      ssl_options.versions.1 = tlsv1.3
      ssl_options.versions.2 = tlsv1.2
      definitions.import_backend = local_filesystem
      definitions.local.path = /etc/inside/broker/definitions.json
      vm_memory_high_watermark.absolute = 512MiB
      disk_free_limit.absolute = 1GB
