<title id="t">Карта harness учебного проекта</title>
<desc id="d">Дерево учебного проекта: AGENTS.md, CODING_STANDARDS.md, DOMAIN.md, docs с описанием модели, ADR, процессом и настройкой скиллов, .agents/skills, код и тесты в apps, конфигурация линтера и package.json. Спецификации и задачи лежат в GitHub Issues вне репозитория.</desc>
