<svg xmlns="http://www.w3.org/2000/svg" width="720" height="764" viewBox="0 0 720 764" fill="none" role="img" aria-labelledby="t d">
<title id="t">Замечание в чате и запись в проекте</title>
<desc id="d">Без записи замечание остаётся в чате первой сессии, и вторая сессия повторяет ошибку. С записью в CODING_STANDARDS.md вторая сессия читает правило и загружает данные вместе.</desc>
<defs><style>
