<svg xmlns="http://www.w3.org/2000/svg" width="720" height="424" viewBox="0 0 720 424" fill="none" role="img" aria-labelledby="t d">
<title id="t">Одно замечание, две записи</title>
<desc id="d">Замечание о запросе владельца на каждую строку даёт две записи: задачу в GitHub Issues на исправление текущего списка и правило в CODING_STANDARDS.md для следующих реализаций.</desc>
<defs><style>
.eb{font-family:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;font-size:11px;letter-spacing:1.1px}
.t{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:14px;font-weight:500}
.s{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:12.5px}
.d{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:13px}
.m{font-family:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;font-size:12px}
.mb{font-family:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;font-size:12.5px}
.ms{font-family:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;font-size:11px}
.mt{font-family:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;font-size:13px;font-weight:500}
.p{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:11.5px;font-weight:500}
.b{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:11px;font-weight:600}
.big{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:22px;font-weight:500;letter-spacing:-0.3px}
@keyframes a-fade{from{opacity:0}}
@keyframes a-rise{from{opacity:0;transform:translateY(8px)}}
@keyframes a-pop{from{opacity:0;transform:scale(.6)}}
@keyframes a-draw{from{stroke-dashoffset:1}}
@keyframes a-grow{from{transform:scaleY(0)}}
@keyframes a-dim{to{opacity:.45}}
.a-fade{animation:a-fade .4s ease-out both}
.a-rise{animation:a-rise .5s cubic-bezier(.2,.8,.2,1) both}
.a-pop{transform-box:fill-box;transform-origin:50% 50%;animation:a-pop .3s cubic-bezier(.2,.8,.2,1) both}
.a-draw{stroke-dasharray:1;animation:a-draw .4s ease-out both}
.a-grow{transform-box:fill-box;transform-origin:50% 0;animation:a-grow .5s cubic-bezier(.3,.8,.3,1) both}
.a-dim{animation:a-dim .6s ease-out forwards}
@media (prefers-reduced-motion:reduce){.a-fade,.a-rise,.a-pop,.a-draw,.a-grow{animation:none}.a-dim{animation:none;opacity:.45}}
</style></defs>
<rect width="720" height="424" rx="20" fill="#F1EEE7"/>
<g class="a-fade" style="animation-delay:0.00s"><text x="28" y="40" class="eb" fill="#67625A">ОДНО ЗАМЕЧАНИЕ, ДВЕ ЗАПИСИ</text><text x="28" y="61" class="d" fill="#67625A">Исправление текущего кода и перенос подхода сохраняются в разных местах.</text></g>
<g class="a-rise" style="animation-delay:0.15s"><rect x="210.0" y="95" width="300" height="65" rx="10" fill="#FBFAF7" stroke="#D9D3C7" stroke-width="1"/><text x="222" y="116" class="t" fill="#1F1E1C">Замечание после ревью</text><text x="222" y="131" class="s" fill="#67625A">список запрашивает владельца на каждую</text><text x="222" y="146" class="s" fill="#67625A">строку</text></g>
<path d="M320 160 L320 178 Q320 184 314 184 L194 184 Q188 184 188 190 L188 209" fill="none" stroke="#A39D92" stroke-width="1.25" stroke-linejoin="round" pathLength="1" class="a-draw" style="animation-delay:0.50s;animation-duration:0.30s"/>
<g class="a-fade" style="animation-delay:0.76s;animation-duration:0.10s"><path d="M188 216 L184 209 L192 209 Z" fill="#A39D92"/></g>
<path d="M400 160 L400 178 Q400 184 406 184 L526 184 Q532 184 532 190 L532 209" fill="none" stroke="#C15F3C" stroke-width="1.25" stroke-linejoin="round" pathLength="1" class="a-draw" style="animation-delay:0.60s;animation-duration:0.30s"/>
<g class="a-fade" style="animation-delay:0.86s;animation-duration:0.10s"><path d="M532 216 L528 209 L536 209 Z" fill="#C15F3C"/></g>
<g class="a-rise" style="animation-delay:0.80s"><rect x="28" y="216" width="320.0" height="83" rx="10" fill="#FBFAF7" stroke="#D9D3C7" stroke-width="1"/><text x="40" y="236" class="eb" fill="#8E887D">ЭТА ЗАДАЧА</text><text x="40" y="255" class="mt" fill="#1F1E1C">GitHub Issue</text><text x="40" y="270" class="s" fill="#67625A">Исправить загрузку владельцев в списке</text><text x="40" y="285" class="s" fill="#67625A">проектов</text></g>
<g class="a-rise" style="animation-delay:0.95s"><rect x="372.0" y="216" width="320.0" height="83" rx="10" fill="#F7E5DA" stroke="#C15F3C" stroke-width="1.5"/><text x="384" y="236" class="eb" fill="#A44A2A">СЛЕДУЮЩИЕ ЗАДАЧИ</text><text x="384" y="255" class="mt" fill="#1F1E1C">CODING_STANDARDS.md</text><text x="384" y="270" class="s" fill="#A44A2A">Связанные данные списка загружаем вместе,</text><text x="384" y="285" class="s" fill="#A44A2A">без запроса на каждую строку</text></g>
<g class="a-fade" style="animation-delay:1.20s"><text x="40" y="321" class="ms" fill="#67625A">исправление текущего кода</text><text x="384" y="321" class="ms" fill="#A44A2A">перенос подхода</text></g>
<g class="a-fade" style="animation-delay:1.40s"><path d="M28 355 H692" stroke="#CFC8BB" stroke-width="1"/><text x="28" y="381" class="ms" fill="#8E887D">Задача описывает исправление этого списка. Правило из стандартов читают исполнитель и ревьюер в</text><text x="28" y="398" class="ms" fill="#8E887D">следующих задачах.</text></g>
</svg>
