<path d="M532 253 L532 268" fill="none" stroke="#C15F3C" stroke-width="1.25" stroke-linejoin="round" pathLength="1" class="a-draw" style="animation-delay:1.60s;animation-duration:0.12s"/>
<g class="a-fade" style="animation-delay:1.70s;animation-duration:0.10s"><path d="M532 275 L528 268 L536 268 Z" fill="#C15F3C"/></g>
<g class="a-rise" style="animation-delay:1.75s"><rect x="372" y="275" width="320" height="65" rx="10" fill="#F7E5DA" stroke="#C15F3C" stroke-width="1.5"/><text x="384" y="296" class="mt" fill="#1F1E1C">CODING_STANDARDS.md</text><text x="384" y="311" class="s" fill="#A44A2A">правило: ситуация, подход, причина и</text><text x="384" y="326" class="s" fill="#A44A2A">ссылка на модуль-образец</text></g>
<g class="a-fade" style="animation-delay:2.10s"><path d="M28 383 H692" stroke="#CFC8BB" stroke-width="1"/><text x="28" y="409" class="ms" fill="#8E887D">Модуль не нужно пересказывать в инструкциях. В записи достаточно правила и ссылки на образец.</text></g>
</svg>
