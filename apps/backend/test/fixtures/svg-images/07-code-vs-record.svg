<g class="a-fade" style="animation-delay:0.90s"><text x="314" y="211" class="ms" fill="#A44A2A" text-anchor="end">владельцы загружаются вместе</text></g>
<g class="a-fade" style="animation-delay:1.00s"><text x="28" y="341" class="s" fill="#67625A">Агент изучает код сам и может взять его как образец.</text></g>
<g class="a-rise" style="animation-delay:1.20s"><rect x="372" y="95" width="320" height="67" rx="10" fill="none" stroke="#A39D92" stroke-width="1" stroke-dasharray="5 4"/><text x="384" y="116" class="t" fill="#67625A">Почему так, а не запрос на каждую</text><text x="384" y="133" class="t" fill="#67625A">строку?</text><text x="384" y="148" class="s" fill="#8E887D">в коде ответа нет</text></g>
<g class="a-rise" style="animation-delay:1.35s"><rect x="372" y="174" width="320" height="67" rx="10" fill="none" stroke="#A39D92" stroke-width="1" stroke-dasharray="5 4"/><text x="384" y="195" class="t" fill="#67625A">Это правило для всех списков?</text><text x="384" y="210" class="s" fill="#8E887D">в коде ответа нет</text></g>
