<svg xmlns="http://www.w3.org/2000/svg" width="720" height="576" viewBox="0 0 720 576" fill="none" role="img" aria-labelledby="t d">
<title id="t">Какие сведения куда сохранять</title>
<desc id="d">Условия задачи идут в спецификацию в GitHub Issues. Правило для следующих реализаций идёт в CODING_STANDARDS.md. Домен и правила продукта идут в DOMAIN.md и docs/domain-model.md. Причина технического выбора идёт в ADR в docs/adr. Порядок работы агента уточняют в скилле, например ship, или в docs/workflow.md.</desc>
<defs><style>
