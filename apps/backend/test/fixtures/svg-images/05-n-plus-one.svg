<svg xmlns="http://www.w3.org/2000/svg" width="720" height="484" viewBox="0 0 720 484" fill="none" role="img" aria-labelledby="t d">
<title id="t">Запрос на каждую строку и пакетная загрузка</title>
<desc id="d">Для списка из трёх проектов отдельный запрос владельца на каждую строку даёт четыре запроса к базе, пакетная загрузка даёт два. При 100 строках это 101 запрос против двух, при 1000 строках 1001 против двух.</desc>
<defs><style>
.eb{font-family:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;font-size:11px;letter-spacing:1.1px}
.t{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:14px;font-weight:500}
.s{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:12.5px}
.d{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:13px}
.m{font-family:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;font-size:12px}
.mb{font-family:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;font-size:12.5px}
.ms{font-family:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;font-size:11px}
.mt{font-family:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;font-size:13px;font-weight:500}
.p{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:11.5px;font-weight:500}
.b{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:11px;font-weight:600}
.big{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:22px;font-weight:500;letter-spacing:-0.3px}
@keyframes a-fade{from{opacity:0}}
@keyframes a-rise{from{opacity:0;transform:translateY(8px)}}
@keyframes a-pop{from{opacity:0;transform:scale(.6)}}
@keyframes a-draw{from{stroke-dashoffset:1}}
@keyframes a-grow{from{transform:scaleY(0)}}
@keyframes a-dim{to{opacity:.45}}
.a-fade{animation:a-fade .4s ease-out both}
.a-rise{animation:a-rise .5s cubic-bezier(.2,.8,.2,1) both}
.a-pop{transform-box:fill-box;transform-origin:50% 50%;animation:a-pop .3s cubic-bezier(.2,.8,.2,1) both}
.a-draw{stroke-dasharray:1;animation:a-draw .4s ease-out both}
.a-grow{transform-box:fill-box;transform-origin:50% 0;animation:a-grow .5s cubic-bezier(.3,.8,.3,1) both}
.a-dim{animation:a-dim .6s ease-out forwards}
@media (prefers-reduced-motion:reduce){.a-fade,.a-rise,.a-pop,.a-draw,.a-grow{animation:none}.a-dim{animation:none;opacity:.45}}
</style></defs>
<rect width="720" height="484" rx="20" fill="#F1EEE7"/>
<g class="a-fade" style="animation-delay:0.05s"><text x="28" y="40" class="eb" fill="#67625A">ЗАПРОС НА КАЖДУЮ СТРОКУ</text><text x="28" y="61" class="d" fill="#67625A">1 запрос за списком и ещё по одному на</text><text x="28" y="79" class="d" fill="#67625A">каждого владельца</text></g>
<g class="a-fade" style="animation-delay:0.10s"><text x="368" y="40" class="eb" fill="#67625A">ПАКЕТНАЯ ЗАГРУЗКА</text><text x="368" y="61" class="d" fill="#67625A">1 запрос за списком и 1 за всеми</text><text x="368" y="79" class="d" fill="#67625A">владельцами сразу</text></g>
<g class="a-rise" style="animation-delay:0.15s"><rect x="28" y="114" width="324.0" height="196" rx="12" fill="#FBFAF7" stroke="#D9D3C7" stroke-width="1"/></g>
<g class="a-rise" style="animation-delay:0.25s"><text x="44" y="140" class="t" fill="#1F1E1C">Список проектов</text><rect x="44" y="154" width="112" height="26" rx="6" fill="#E4DFD4"/><text x="54" y="171" class="s" fill="#1F1E1C">Проект A</text><rect x="44" y="188" width="112" height="26" rx="6" fill="#E4DFD4"/><text x="54" y="205" class="s" fill="#1F1E1C">Проект B</text><rect x="44" y="222" width="112" height="26" rx="6" fill="#E4DFD4"/><text x="54" y="239" class="s" fill="#1F1E1C">Проект C</text></g>
<g class="a-rise" style="animation-delay:0.30s"><rect x="278.0" y="150" width="58" height="112" rx="8" fill="#E4DFD4"/><ellipse cx="307.0" cy="170" rx="16" ry="5" fill="none" stroke="#8E887D"/><path d="M291.0 170 v14 a16 5 0 0 0 32 0 v-14" fill="none" stroke="#8E887D"/><text x="307" y="210" class="s" fill="#1F1E1C" text-anchor="middle">База</text><text x="307" y="225" class="s" fill="#1F1E1C" text-anchor="middle">данных</text></g>
<g class="a-fade" style="animation-delay:0.60s"><text x="218" y="158" class="ms" fill="#67625A" text-anchor="middle">projects</text></g>
<path d="M164 164 L265 164" fill="none" stroke="#67625A" stroke-width="1.25" stroke-linejoin="round" pathLength="1" class="a-draw" style="animation-delay:0.60s;animation-duration:0.25s"/>
<g class="a-fade" style="animation-delay:0.81s;animation-duration:0.10s"><path d="M272 164 L265 168 L265 160 Z" fill="#67625A"/></g>
<g class="a-fade" style="animation-delay:1.00s"><text x="218" y="191.333" class="ms" fill="#67625A" text-anchor="middle">owner · проект A</text></g>
<path d="M164 197.333 L265 197.333" fill="none" stroke="#67625A" stroke-width="1.25" stroke-linejoin="round" pathLength="1" class="a-draw" style="animation-delay:1.00s;animation-duration:0.25s"/>
<g class="a-fade" style="animation-delay:1.21s;animation-duration:0.10s"><path d="M272 197.333 L265 201.333 L265 193.333 Z" fill="#67625A"/></g>
<g class="a-fade" style="animation-delay:1.40s"><text x="218" y="224.667" class="ms" fill="#67625A" text-anchor="middle">owner · проект B</text></g>
<path d="M164 230.667 L265 230.667" fill="none" stroke="#67625A" stroke-width="1.25" stroke-linejoin="round" pathLength="1" class="a-draw" style="animation-delay:1.40s;animation-duration:0.25s"/>
<g class="a-fade" style="animation-delay:1.61s;animation-duration:0.10s"><path d="M272 230.667 L265 234.667 L265 226.667 Z" fill="#67625A"/></g>
<g class="a-fade" style="animation-delay:1.80s"><text x="218" y="258" class="ms" fill="#67625A" text-anchor="middle">owner · проект C</text></g>
<path d="M164 264 L265 264" fill="none" stroke="#67625A" stroke-width="1.25" stroke-linejoin="round" pathLength="1" class="a-draw" style="animation-delay:1.80s;animation-duration:0.25s"/>
<g class="a-fade" style="animation-delay:2.01s;animation-duration:0.10s"><path d="M272 264 L265 268 L265 260 Z" fill="#67625A"/></g>
<g class="a-pop" style="animation-delay:2.30s"><text x="44" y="292" class="big" fill="#1F1E1C">4 запроса</text></g>
<g class="a-fade" style="animation-delay:2.30s"><text x="336" y="288" class="s" fill="#67625A" text-anchor="end">к базе на 3 строки</text></g>
<g class="a-rise" style="animation-delay:0.20s"><rect x="368.0" y="114" width="324.0" height="196" rx="12" fill="#FBFAF7" stroke="#C15F3C" stroke-width="1.5"/></g>
<g class="a-rise" style="animation-delay:0.30s"><text x="384" y="140" class="t" fill="#1F1E1C">Список проектов</text><rect x="384.0" y="154" width="112" height="26" rx="6" fill="#E4DFD4"/><text x="394" y="171" class="s" fill="#1F1E1C">Проект A</text><rect x="384.0" y="188" width="112" height="26" rx="6" fill="#E4DFD4"/><text x="394" y="205" class="s" fill="#1F1E1C">Проект B</text><rect x="384.0" y="222" width="112" height="26" rx="6" fill="#E4DFD4"/><text x="394" y="239" class="s" fill="#1F1E1C">Проект C</text></g>
<g class="a-rise" style="animation-delay:0.35s"><rect x="618.0" y="150" width="58" height="112" rx="8" fill="#E4DFD4"/><ellipse cx="647.0" cy="170" rx="16" ry="5" fill="none" stroke="#8E887D"/><path d="M631.0 170 v14 a16 5 0 0 0 32 0 v-14" fill="none" stroke="#8E887D"/><text x="647" y="210" class="s" fill="#1F1E1C" text-anchor="middle">База</text><text x="647" y="225" class="s" fill="#1F1E1C" text-anchor="middle">данных</text></g>
<g class="a-fade" style="animation-delay:0.60s"><text x="558" y="170" class="ms" fill="#A44A2A" text-anchor="middle">projects</text></g>
<path d="M504 176 L605 176" fill="none" stroke="#C15F3C" stroke-width="1.25" stroke-linejoin="round" pathLength="1" class="a-draw" style="animation-delay:0.60s;animation-duration:0.25s"/>
<g class="a-fade" style="animation-delay:0.81s;animation-duration:0.10s"><path d="M612 176 L605 180 L605 172 Z" fill="#C15F3C"/></g>
<g class="a-fade" style="animation-delay:1.00s"><text x="558" y="218" class="ms" fill="#A44A2A" text-anchor="middle">owners · A, B, C</text></g>
<path d="M504 224 L605 224" fill="none" stroke="#C15F3C" stroke-width="1.25" stroke-linejoin="round" pathLength="1" class="a-draw" style="animation-delay:1.00s;animation-duration:0.25s"/>
<g class="a-fade" style="animation-delay:1.21s;animation-duration:0.10s"><path d="M612 224 L605 228 L605 220 Z" fill="#C15F3C"/></g>
<g class="a-pop" style="animation-delay:1.50s"><text x="384" y="292" class="big" fill="#A44A2A">2 запроса</text></g>
<g class="a-fade" style="animation-delay:1.50s"><text x="676" y="288" class="s" fill="#67625A" text-anchor="end">к базе на 3 строки</text></g>
<g class="a-fade" style="animation-delay:2.60s"><text x="28" y="344" class="ms" fill="#8E887D">ЧИСЛО ЗАПРОСОВ ПРИ РОСТЕ СПИСКА</text></g>
<g class="a-rise" style="animation-delay:2.70s"><text x="436" y="372" class="ms" fill="#8E887D" text-anchor="end">3 строки</text><text x="556" y="372" class="ms" fill="#8E887D" text-anchor="end">100 строк</text><text x="680" y="372" class="ms" fill="#8E887D" text-anchor="end">1000 строк</text><path d="M28 382 H692" stroke="#CFC8BB"/><text x="28" y="404" class="d" fill="#1F1E1C">Запрос на каждую строку</text><text x="436" y="404" class="t" fill="#1F1E1C" text-anchor="end">4</text><text x="556" y="404" class="t" fill="#1F1E1C" text-anchor="end">101</text><text x="680" y="404" class="t" fill="#1F1E1C" text-anchor="end">1001</text><path d="M28 416 H692" stroke="#CFC8BB"/><text x="28" y="438" class="d" fill="#A44A2A">Пакетная загрузка</text><text x="436" y="438" class="t" fill="#A44A2A" text-anchor="end">2</text><text x="556" y="438" class="t" fill="#A44A2A" text-anchor="end">2</text><text x="680" y="438" class="t" fill="#A44A2A" text-anchor="end">2</text></g>
</svg>
