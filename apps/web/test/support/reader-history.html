<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Reader history contract</title>
  </head>
  <body>
    <script type="module">
      import {
        readerHistoryRoot,
        enterReaderHistory,
        prepareReaderHistory,
        prepareReaderOriginReturn,
        readerOriginHref,
        saveReaderHistoryView,
      } from "/src/shared/lib/reader-history.ts";
      const source = "/products/course/tasks/start";
      const context =
        "?from=%2Fproducts%2Fcourse%2Fprogramme&anchor=task%3Astart";
      function render() {
        const supplementary = location.pathname.startsWith("/materials/");
        document.body.innerHTML = `<section hidden><aside data-course-chapter="stale"><details data-course-chapter-id="stale"><summary>Stale chapter</summary></details><div data-course-rail-scroll></div></aside></section><div data-reader-history-root data-course-reading-host><h1>${location.pathname}</h1><aside data-course-chapter="second"><details data-course-chapter-id="second"><summary>Second chapter</summary><p>Expanded chapter</p></details><div data-course-rail-scroll style="height:80px;overflow:auto"><div style="height:600px">Rail</div></div></aside><main data-material-id="current" data-application-content style="height:400px;overflow:auto"><div style="height:1600px"><a id="project" href="/materials/project${context}">Project</a> <a id="brief" href="/materials/brief${context}">Brief</a> <a id="return" href="${readerOriginHref(source) ?? source}">Return</a><p>Document body</p></div></main></div>`;
        // Model a streamed intermediate document whose links arrive before its Tracker.
        if (!(
          location.pathname === "/materials/project" &&
          location.search.includes("deferHistory=1")
        ))
          enterReaderHistory(
            supplementary ? source : undefined,
            readerHistoryRoot(document.querySelector("#project")),
          );
        // Completing a streamed page or refreshing it replaces the router's state at the same URL.
        history.replaceState({ __NA: true }, "", location.href);
        document.querySelector("#return").href =
          readerOriginHref(source) ?? source;
        document
          .querySelector("main")
          .addEventListener("scroll", () =>
            saveReaderHistoryView(
              readerHistoryRoot(document.querySelector("#project")),
            ),
          );
      }
      document.addEventListener("click", (event) => {
        prepareReaderHistory(
          event,
          location.pathname.startsWith("/materials/") ? source : undefined,
          readerHistoryRoot(document.querySelector("#project")),
        );
        const link = event.target.closest("a");
        if (
          !link ||
          event.metaKey ||
          event.ctrlKey ||
          event.shiftKey ||
          event.altKey
        )
          return;
        if (link.id === "return")
          prepareReaderOriginReturn(
            link.href,
            readerHistoryRoot(document.querySelector("#project")),
          );
        event.preventDefault();
        history.pushState({ __NA: true }, "", link.href);
        render();
      });
      window.addEventListener("popstate", render);
      window.addEventListener("pagehide", () =>
        saveReaderHistoryView(
          readerHistoryRoot(document.querySelector("#project")),
        ),
      );
      render();
      window.readerHistoryReady = true;
    </script>
  </body>
</html>
