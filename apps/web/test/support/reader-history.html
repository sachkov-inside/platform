<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Reader history contract</title>
  </head>
  <body>
    <script type="module">
      import {
        enterReaderHistory,
        prepareReaderHistory,
        prepareReaderOriginReturn,
        readerOriginHref,
        saveReaderHistoryView,
      } from "/src/shared/lib/reader-history.ts";
      const source = "/products/course/tasks/start";
      const context =
        "?from=%2Fproducts%2Fcourse%2Fprogramme&anchor=task%3Astart";
      function render() {
        const supplementary = location.pathname.startsWith("/materials/");
        document.body.innerHTML = `<h1>${location.pathname}</h1><aside data-course-chapter="second"><details data-course-chapter-id="second"><summary>Second chapter</summary><p>Expanded chapter</p></details><div data-course-rail-scroll style="height:80px;overflow:auto"><div style="height:600px">Rail</div></div></aside><main data-application-content style="height:400px;overflow:auto"><div style="height:1600px"><a id="project" href="/materials/project${context}">Project</a> <a id="brief" href="/materials/brief${context}">Brief</a> <a id="return" href="${readerOriginHref(source) ?? source}">Return</a><p>Document body</p></div></main>`;
        enterReaderHistory(supplementary ? source : undefined);
        document.querySelector("#return").href =
          readerOriginHref(source) ?? source;
        document
          .querySelector("main")
          .addEventListener("scroll", saveReaderHistoryView);
      }
      document.addEventListener("click", (event) => {
        prepareReaderHistory(
          event,
          location.pathname.startsWith("/materials/") ? source : undefined,
        );
        const link = event.target.closest("a");
        if (
          !link ||
          event.metaKey ||
          event.ctrlKey ||
          event.shiftKey ||
          event.altKey
        )
          return;
        if (link.id === "return") prepareReaderOriginReturn(link.href);
        event.preventDefault();
        history.pushState({ __NA: true }, "", link.href);
        render();
      });
      window.addEventListener("popstate", render);
      window.addEventListener("pagehide", saveReaderHistoryView);
      render();
      window.readerHistoryReady = true;
    </script>
  </body>
</html>
