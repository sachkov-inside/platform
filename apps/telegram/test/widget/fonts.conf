<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Trainer widget browser checks on Linux (#2026). The widget draws with system-ui, so its layout
  follows the machine's default sans font. GitHub's Ubuntu runner defaults to DejaVu Sans, which
  is far wider than the fonts of Telegram clients, and the size checks failed only there.
  The checks pin the default to Liberation Sans, which the Playwright system dependencies bring
  with the browsers. macOS draws with Core Text and ignores this file.
-->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <alias binding="strong">
    <family>system-ui</family>
    <prefer><family>Liberation Sans</family></prefer>
  </alias>
  <alias binding="strong">
    <family>sans-serif</family>
    <prefer><family>Liberation Sans</family></prefer>
  </alias>
  <alias binding="strong">
    <family>sans</family>
    <prefer><family>Liberation Sans</family></prefer>
  </alias>
</fontconfig>
