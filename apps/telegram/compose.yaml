name: ${COMPOSE_PROJECT_NAME:?Set a unique Telegram Compose project name}

services:
  rabbitmq:
    image: public.ecr.aws/docker/library/rabbitmq:4.3-management-alpine@sha256:3ef7f7e89fed709a78f79b8b5f4e30e1312a1d4089da752e23595566d9d61a95
    environment:
      RABBITMQ_DEFAULT_USER: telegram_checks
      RABBITMQ_DEFAULT_PASS: telegram_checks
    ports:
      - "127.0.0.1:${TELEGRAM_AMQP_PORT:?Set a free Telegram AMQP port}:5672"
      - "127.0.0.1:${TELEGRAM_MANAGEMENT_PORT:?Set a free Telegram management port}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30

  postgres:
    image: public.ecr.aws/docker/library/postgres:18.4-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
    environment:
      POSTGRES_DB: inside_telegram
      POSTGRES_PASSWORD: inside
      POSTGRES_USER: inside
    ports:
      - "127.0.0.1:${TELEGRAM_POSTGRES_PORT:?Set a free Telegram PostgreSQL port}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inside -d inside_telegram"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - postgres-data:/var/lib/postgresql

volumes:
  postgres-data:
