name: ${COMPOSE_PROJECT_NAME:?Set a unique Telegram Compose project name}

services:
  rabbitmq:
    image: ghcr.io/sachkov-inside/rabbitmq:4.4.0-management-alpine@sha256:4841f6384ef8313c3594cd3f2e9f40c10805f8a61c45f08a9a5d9ddea8199267
    environment:
      RABBITMQ_DEFAULT_USER: telegram_checks
      RABBITMQ_DEFAULT_PASS: telegram_checks
    ports:
      - "127.0.0.1:${TELEGRAM_AMQP_PORT:?Set a free Telegram AMQP port}:5672"
      - "127.0.0.1:${TELEGRAM_MANAGEMENT_PORT:?Set a free Telegram management port}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30

  postgres:
    image: ghcr.io/sachkov-inside/postgres:18.7-alpine@sha256:75dcac3dfb1cd01ca3536910bbc84128759362f8b118bf8c55b38a94f68f3b73
    environment:
      POSTGRES_DB: inside_telegram
      POSTGRES_PASSWORD: inside
      POSTGRES_USER: inside
    ports:
      - "127.0.0.1:${TELEGRAM_POSTGRES_PORT:?Set a free Telegram PostgreSQL port}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inside -d inside_telegram"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - postgres-data:/var/lib/postgresql

volumes:
  postgres-data:
