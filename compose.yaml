name: inside-platform

services:
  rabbitmq:
    build:
      context: ./infra/notifications
    hostname: rabbitmq
    volumes:
      - notification-broker-data:/var/lib/rabbitmq
      - notification-local-ca:/local-ca
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 5s
      timeout: 5s
      retries: 30
    stop_grace_period: 30s

  notifications-worker:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      target: notifications-worker
    env_file:
      - ./config/compose/local/notifications-worker.env
    volumes:
      - notification-local-ca:/local-ca:ro
    healthcheck:
      test: ["CMD", "node", "-e", "const fs=require('node:fs'); const m=JSON.parse(fs.readFileSync('/tmp/inside-platform-worker-ready.json','utf8')); if(m.process!=='notifications-worker'||m.status!=='ready')process.exit(1)"]
      interval: 5s
      timeout: 3s
      retries: 30
    depends_on:
      postgres:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      object-storage:
        condition: service_healthy
    init: true
    stop_grace_period: 15s

  object-storage:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "--console-address", ":9001", "/data"]
    env_file:
      - ./config/compose/local/object-storage.env
    ports:
      - "127.0.0.1:${OBJECT_STORAGE_HOST_PORT:-9000}:9000"
      - "127.0.0.1:${OBJECT_STORAGE_CONSOLE_HOST_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - object-storage-data:/data

  postgres:
    image: postgres:18.4-alpine3.23
    env_file:
      - ./config/compose/local/postgres.env
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - postgres-data:/var/lib/postgresql

  migrations:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      target: migrations
    env_file:
      - ./config/compose/local/migrations.env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  seed:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      target: seed
    env_file:
      - ./config/compose/local/seed.env
    depends_on:
      migrations:
        condition: service_completed_successfully
    restart: "no"

  api:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      target: api
    env_file:
      - ./config/compose/local/api.env
      # Значения входа генерирует bootstrap Logto; без профиля входа файла просто нет, и стек
      # поднимается как раньше. Второй копии этих значений в репозитории не существует.
      - path: ./.identity-proof/stand.env
        required: false
    volumes:
      - ./.identity-proof/tls:/identity-tls:ro
    depends_on:
      postgres:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
      object-storage:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_HOST_PORT:-3001}:3001"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 2s
      timeout: 3s
      retries: 30
    init: true
    stop_grace_period: 10s

  mcp:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      target: mcp
    env_file:
      - ./config/compose/local/mcp.env
    depends_on:
      postgres:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
      object-storage:
        condition: service_healthy
    ports:
      - "127.0.0.1:${MCP_HOST_PORT:-3002}:3002"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3002/.well-known/oauth-protected-resource/mcp').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 2s
      timeout: 3s
      retries: 30
    init: true
    stop_grace_period: 10s

  material-assets-worker:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      target: material-assets-worker
    env_file:
      - ./config/compose/local/material-assets-worker.env
    depends_on:
      postgres:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
      object-storage:
        condition: service_healthy
    init: true
    stop_grace_period: 10s

  profile-avatars-worker:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      target: profile-avatars-worker
    env_file:
      - ./config/compose/local/profile-avatars-worker.env
    depends_on:
      postgres:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
      object-storage:
        condition: service_healthy
    init: true
    stop_grace_period: 10s

  video-deletions-worker:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      target: video-deletions-worker
    env_file:
      - ./config/compose/local/video-deletions-worker.env
    depends_on:
      postgres:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    init: true
    stop_grace_period: 10s

  billing-worker:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      target: billing-worker
    env_file:
      - ./config/compose/local/billing-worker.env
    depends_on:
      postgres:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    init: true
    stop_grace_period: 10s

  bank-double:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      target: bank-double
    env_file:
      - ./config/compose/local/bank-double.env
    ports:
      - "127.0.0.1:${BANK_DOUBLE_HOST_PORT:-8090}:8090"
    volumes:
      - bank-double-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8090/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 2s
      timeout: 3s
      retries: 30
    init: true
    stop_grace_period: 10s

  # Вход стенда. Профиль `identity` включает его по требованию: обычный стек поднимается без него,
  # как раньше. Псевдоним сети даёт приложению тот же адрес входа, который открывает браузер.
  # Образ тот же, что у одноразового окружения `infra/identity/logto/compose.yaml`: один тег на
  # оба стенда, и `scripts/identity-proof-artifacts.test.mjs` держит их версии вместе.
  logto:
    profiles: [identity]
    build:
      context: ./infra/identity/logto
      dockerfile: Dockerfile
    image: inside/logto-proof:1.41.0-inside.6
    entrypoint:
      [
        "sh",
        "-c",
        "npm run cli db seed -- --swe --disable-admin-pwned-password-check && npm start",
      ]
    env_file:
      - ./config/compose/local/logto.env
    depends_on:
      logto-postgres:
        condition: service_healthy
    networks:
      default:
        aliases:
          - identity.inside.localhost
    # Порт входа не выбирается: OIDC сверяет issuer точным совпадением строки, поэтому снаружи и
    # внутри сети адрес должен быть один и тот же.
    ports:
      - "127.0.0.1:3301:3301"
      - "127.0.0.1:3302:3302"
    healthcheck:
      # Сертификат стенда самоподписанный, и проверять его здесь нечем: проба обращается к самому
      # себе по петле. Ослабление живёт внутри одной команды проверки и не касается приложения.
      test:
        [
          "CMD",
          "node",
          "-e",
          "process.env.NODE_TLS_REJECT_UNAUTHORIZED='0'; fetch('https://127.0.0.1:3301/api/status').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 3s
      timeout: 5s
      retries: 40
    volumes:
      - ./.identity-proof/tls:/identity-tls:ro
    init: true
    stop_grace_period: 10s

  logto-postgres:
    profiles: [identity]
    image: postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
    env_file:
      - ./config/compose/local/logto-postgres.env
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - logto-postgres-data:/var/lib/postgresql/data

  # Перехватчик писем стенда: общий для всех отправителей, наружу не отправляет ничего.
  mailpit:
    image: ghcr.io/axllent/mailpit:v1.30.6@sha256:7f33095f80e901f6ad08028f06ca284aa58fe84942be5496008d041d3b9f4d4d
    env_file:
      - ./config/compose/local/mailpit.env
    ports:
      - "127.0.0.1:${MAIL_CAPTURE_SMTP_HOST_PORT:-1025}:1025"
      - "127.0.0.1:${MAIL_CAPTURE_HOST_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 3s
      retries: 30

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: web
    env_file:
      - ./config/compose/local/web.env
      - path: ./.identity-proof/stand.env
        required: false
    volumes:
      - ./.identity-proof/tls:/identity-tls:ro
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-3000}:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 2s
      timeout: 5s
      retries: 45
    init: true
    stop_grace_period: 10s

  storybook:
    profiles: [storybook]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: storybook
    env_file:
      - ./config/compose/local/storybook.env
    ports:
      - "127.0.0.1:${STORYBOOK_HOST_PORT:-6006}:6006"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:6006').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 2s
      timeout: 5s
      retries: 45
    init: true
    stop_grace_period: 10s

volumes:
  bank-double-data:
  logto-postgres-data:
  object-storage-data:
  postgres-data:
  notification-broker-data:
  notification-local-ca:
