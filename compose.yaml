name: inside-platform

services:
  object-storage:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "--console-address", ":9001", "/data"]
    env_file:
      - ./config/compose/local/object-storage.env
    ports:
      - "127.0.0.1:${OBJECT_STORAGE_HOST_PORT:-9000}:9000"
      - "127.0.0.1:${OBJECT_STORAGE_CONSOLE_HOST_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - object-storage-data:/data

  postgres:
    image: postgres:18.4-alpine3.23
    env_file:
      - ./config/compose/local/postgres.env
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - postgres-data:/var/lib/postgresql

  migrations:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      target: migrations
    env_file:
      - ./config/compose/local/migrations.env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  seed:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      target: seed
    env_file:
      - ./config/compose/local/seed.env
    depends_on:
      migrations:
        condition: service_completed_successfully
    restart: "no"

  api:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      target: api
    env_file:
      - ./config/compose/local/api.env
    depends_on:
      postgres:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
      object-storage:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_HOST_PORT:-3001}:3001"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 2s
      timeout: 3s
      retries: 30
    init: true
    stop_grace_period: 10s

  mcp:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      target: mcp
    env_file:
      - ./config/compose/local/mcp.env
    depends_on:
      postgres:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
      object-storage:
        condition: service_healthy
    ports:
      - "127.0.0.1:${MCP_HOST_PORT:-3002}:3002"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3002/.well-known/oauth-protected-resource/mcp').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 2s
      timeout: 3s
      retries: 30
    init: true
    stop_grace_period: 10s

  material-assets-worker:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      target: material-assets-worker
    env_file:
      - ./config/compose/local/material-assets-worker.env
    depends_on:
      postgres:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
      object-storage:
        condition: service_healthy
    init: true
    stop_grace_period: 10s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: web
    env_file:
      - ./config/compose/local/web.env
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-3000}:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 2s
      timeout: 5s
      retries: 45
    init: true
    stop_grace_period: 10s

  storybook:
    profiles: [storybook]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: storybook
    env_file:
      - ./config/compose/local/storybook.env
    ports:
      - "127.0.0.1:${STORYBOOK_HOST_PORT:-6006}:6006"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:6006').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 2s
      timeout: 5s
      retries: 45
    init: true
    stop_grace_period: 10s

volumes:
  object-storage-data:
  postgres-data:
