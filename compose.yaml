name: inside-platform

services:
  postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-inside}
      POSTGRES_USER: ${POSTGRES_USER:-inside}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-inside}
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-inside} -d ${POSTGRES_DB:-inside}",
        ]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - postgres-data:/var/lib/postgresql

volumes:
  postgres-data:
