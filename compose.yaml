name: inside-platform

x-backend-develop: &backend-develop
  watch:
    - action: sync
      path: ./apps/backend/src
      target: /workspace/apps/backend/src
    - action: rebuild
      path: ./apps/backend/package.json
    - action: rebuild
      path: ./package.json
    - action: rebuild
      path: ./pnpm-lock.yaml
    - action: rebuild
      path: ./pnpm-workspace.yaml

x-web-develop: &web-develop
  watch:
    - action: sync
      path: ./apps/web
      target: /workspace/apps/web
      ignore:
        - .next/
        - node_modules/
        - package.json
        - storybook-static/
    - action: rebuild
      path: ./apps/web/package.json
    - action: rebuild
      path: ./package.json
    - action: rebuild
      path: ./pnpm-lock.yaml
    - action: rebuild
      path: ./pnpm-workspace.yaml

services:
  object-storage:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: ["server", "--console-address", ":9001", "/data"]
    environment:
      MINIO_ROOT_USER: ${OBJECT_STORAGE_ACCESS_KEY_ID:-inside-local-access-key}
      MINIO_ROOT_PASSWORD: ${OBJECT_STORAGE_SECRET_ACCESS_KEY:-inside-local-secret-key}
    ports:
      - "127.0.0.1:${OBJECT_STORAGE_HOST_PORT:-9000}:9000"
      - "127.0.0.1:${OBJECT_STORAGE_CONSOLE_HOST_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - object-storage-data:/data

  postgres:
    image: postgres:18.4-alpine3.23@sha256:996d0920e4ff9df1fc19dacb904492f3c1ec0ec1cc338f0ad7123be7731c5f5e
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-inside}
      POSTGRES_USER: ${POSTGRES_USER:-inside}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-inside}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-inside} -d ${POSTGRES_DB:-inside}",
        ]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - postgres-data:/var/lib/postgresql

  bootstrap:
    build:
      context: .
      dockerfile: Dockerfile
      target: bootstrap
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-inside}:${POSTGRES_PASSWORD:-inside}@postgres:5432/${POSTGRES_DB:-inside}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-inside}:${POSTGRES_PASSWORD:-inside}@postgres:5432/${POSTGRES_DB:-inside}
      API_HOST: 0.0.0.0
      API_PORT: "3001"
      OBJECT_STORAGE_ENDPOINT: http://object-storage:9000
      OBJECT_STORAGE_ACCESS_KEY_ID: ${OBJECT_STORAGE_ACCESS_KEY_ID:-inside-local-access-key}
      OBJECT_STORAGE_SECRET_ACCESS_KEY: ${OBJECT_STORAGE_SECRET_ACCESS_KEY:-inside-local-secret-key}
    depends_on:
      postgres:
        condition: service_healthy
      bootstrap:
        condition: service_completed_successfully
      object-storage:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_HOST_PORT:-3001}:3001"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 2s
      timeout: 3s
      retries: 30
    init: true
    stop_grace_period: 10s
    develop: *backend-develop

  mcp:
    build:
      context: .
      dockerfile: Dockerfile
      target: mcp
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-inside}:${POSTGRES_PASSWORD:-inside}@postgres:5432/${POSTGRES_DB:-inside}
      MCP_HOST: 0.0.0.0
      MCP_PORT: "3002"
      MCP_SERVER_URL: http://127.0.0.1:${MCP_HOST_PORT:-3002}/mcp
      OBJECT_STORAGE_ENDPOINT: http://object-storage:9000
      OBJECT_STORAGE_ACCESS_KEY_ID: ${OBJECT_STORAGE_ACCESS_KEY_ID:-inside-local-access-key}
      OBJECT_STORAGE_SECRET_ACCESS_KEY: ${OBJECT_STORAGE_SECRET_ACCESS_KEY:-inside-local-secret-key}
    depends_on:
      postgres:
        condition: service_healthy
      bootstrap:
        condition: service_completed_successfully
      object-storage:
        condition: service_healthy
    ports:
      - "127.0.0.1:${MCP_HOST_PORT:-3002}:3002"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3002/.well-known/oauth-protected-resource/mcp').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 2s
      timeout: 3s
      retries: 30
    init: true
    stop_grace_period: 10s
    develop: *backend-develop

  material-assets-worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: material-assets-worker
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-inside}:${POSTGRES_PASSWORD:-inside}@postgres:5432/${POSTGRES_DB:-inside}
      OBJECT_STORAGE_ENDPOINT: http://object-storage:9000
      OBJECT_STORAGE_ACCESS_KEY_ID: ${OBJECT_STORAGE_ACCESS_KEY_ID:-inside-local-access-key}
      OBJECT_STORAGE_SECRET_ACCESS_KEY: ${OBJECT_STORAGE_SECRET_ACCESS_KEY:-inside-local-secret-key}
    depends_on:
      postgres:
        condition: service_healthy
      bootstrap:
        condition: service_completed_successfully
      object-storage:
        condition: service_healthy
    init: true
    stop_grace_period: 10s
    develop: *backend-develop

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    environment:
      NODE_ENV: development
      BACKEND_BASE_URL: http://api:3001
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-3000}:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 2s
      timeout: 5s
      retries: 45
    init: true
    stop_grace_period: 10s
    develop: *web-develop

  storybook:
    profiles: [storybook]
    build:
      context: .
      dockerfile: Dockerfile
      target: storybook
    environment:
      NODE_ENV: development
    ports:
      - "127.0.0.1:${STORYBOOK_HOST_PORT:-6006}:6006"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:6006').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 2s
      timeout: 5s
      retries: 45
    init: true
    stop_grace_period: 10s
    develop: *web-develop

volumes:
  object-storage-data:
  postgres-data:
