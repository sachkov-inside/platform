name: Build release images

on:
  workflow_call:
    inputs:
      source_sha:
        description: Exact commit to build
        required: true
        type: string
      version:
        description: Accepted ordinal version
        required: true
        type: string
      vulnerability_waiver_reason:
        description: Auditable owner reason for accepting high or critical findings
        required: false
        default: ""
        type: string

permissions: {}

jobs:
  build-and-verify:
    name: Build and verify ${{ matrix.kind }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: backend
            dockerfile: apps/backend/Dockerfile
            target: backend-production
            image_name: ghcr.io/sachkov-inside/platform-backend
          - kind: web
            dockerfile: apps/web/Dockerfile
            target: web-production
            image_name: ghcr.io/sachkov-inside/platform-web
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
      packages: write
    steps:
      - name: Check out captured source
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.3.0
      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push exact source
        id: build
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: true
          tags: ${{ matrix.image_name }}:${{ inputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ inputs.source_sha }}
            org.opencontainers.image.version=${{ inputs.version }}
          provenance: false
          sbom: false
      - name: Prepare release data directory
        run: mkdir -p release-data
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@v0.24.2
        with:
          image: ${{ matrix.image_name }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: release-data/${{ matrix.kind }}.sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Classify vulnerability waiver
        id: waiver
        env:
          WAIVER_REASON: ${{ inputs.vulnerability_waiver_reason }}
        run: |
          if [[ -n "${WAIVER_REASON//[[:space:]]/}" ]]; then
            echo "enabled=true" >>"$GITHUB_OUTPUT"
          else
            echo "enabled=false" >>"$GITHUB_OUTPUT"
          fi
      - name: Scan the SBOM for vulnerabilities
        uses: anchore/scan-action@v7.4.2
        with:
          sbom: release-data/${{ matrix.kind }}.sbom.spdx.json
          output-format: json
          output-file: release-data/${{ matrix.kind }}.vulnerabilities.json
          fail-build: ${{ steps.waiver.outputs.enabled != 'true' }}
          severity-cutoff: high
      - name: Attest build provenance
        uses: actions/attest@v4.2.2
        with:
          subject-name: ${{ matrix.image_name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Attest SPDX SBOM
        uses: actions/attest@v4.2.2
        with:
          subject-name: ${{ matrix.image_name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: release-data/${{ matrix.kind }}.sbom.spdx.json
          push-to-registry: true
      - name: Verify standard image attestations
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_NAME: ${{ matrix.image_name }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          bash scripts/verify-release-attestations.sh \
            "${IMAGE_NAME}@${IMAGE_DIGEST}" \
            "$SOURCE_SHA"
      - name: Record verified image
        env:
          IMAGE_NAME: ${{ matrix.image_name }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          KIND: ${{ matrix.kind }}
          RELEASE_ACTOR: ${{ github.actor }}
          RELEASE_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          WAIVER_ENABLED: ${{ steps.waiver.outputs.enabled }}
          WAIVER_REASON: ${{ inputs.vulnerability_waiver_reason }}
        run: |
          waiver=null
          if [[ "$WAIVER_ENABLED" == "true" ]]; then
            waiver="$(
              jq --null-input \
                --arg actor "$RELEASE_ACTOR" \
                --arg reason "$WAIVER_REASON" \
                --arg runUrl "$RELEASE_RUN_URL" \
                '{actor, reason, runUrl}'
            )"
          fi
          jq --null-input \
            --arg imageName "$IMAGE_NAME" \
            --arg imageDigest "$IMAGE_DIGEST" \
            --arg sourceSha "$SOURCE_SHA" \
            --argjson waiver "$waiver" \
            '{
              image: {name: $imageName, digest: $imageDigest},
              sourceSha: $sourceSha,
              vulnerabilityWaiver: $waiver
            }' >"release-data/${KIND}.image.json"
      - name: Prove public digest access
        env:
          IMAGE_NAME: ${{ matrix.image_name }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker logout ghcr.io
          docker buildx imagetools inspect "${IMAGE_NAME}@${IMAGE_DIGEST}"
      - name: Upload verified release data
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-image-${{ matrix.kind }}
          path: |
            release-data/${{ matrix.kind }}.image.json
            release-data/${{ matrix.kind }}.vulnerabilities.json
          if-no-files-found: error
          retention-days: 7
