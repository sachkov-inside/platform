name: Foundation recovery proof

on:
  workflow_call:
    inputs:
      source_sha:
        description: Exact candidate commit
        required: true
        type: string
      base_sha:
        description: Comparison base; empty release comparisons run the complete proof
        required: false
        type: string
      head_sha:
        description: Comparison head
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: foundation-recovery-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      required: ${{ steps.paths.outputs.required }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Select only foundation recovery changes
        id: paths
        env:
          BASE_SHA: ${{ inputs.base_sha }}
          HEAD_SHA: ${{ inputs.head_sha }}
        run: |
          set -euo pipefail
          if test -z "$BASE_SHA" && test -z "$HEAD_SHA"; then
            echo 'required=true' >>"$GITHUB_OUTPUT"
            exit 0
          fi
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ && "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          status=0
          git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- \
            pnpm-lock.yaml package.json pnpm-workspace.yaml \
            infra/production/database scripts/foundation-recovery-proof.py \
            compose.production.yaml infra/production/host/inside-broker-preflight \
            infra/production/host/install-docker-compose.sh \
            .github/actions/setup-docker-compose/action.yml \
            scripts/broker-upgrade-proof.py scripts/test_broker_upgrade_proof.py \
            scripts/heavy-check/processes.py \
            scripts/test_foundation_recovery_proof.py scripts/test_foundation_recovery_lifecycle_docker.py \
            scripts/foundation-repository-transition.py scripts/backup-repository-inventory.py \
            scripts/test_backup_repository_inventory.py scripts/test_backup_repository_transition.py \
            scripts/test_backup_repository_compose.py \
            .github/workflows/foundation-recovery.yml || status=$?
          case "$status" in
            0) echo 'required=false' >>"$GITHUB_OUTPUT" ;;
            1) echo 'required=true' >>"$GITHUB_OUTPUT" ;;
            *) exit "$status" ;;
          esac
  recover:
    needs: plan
    if: ${{ needs.plan.outputs.required == 'true' }}
    name: Native encrypted recovery (${{ matrix.architecture }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            architecture: amd64
          - runner: ubuntu-24.04-arm
            architecture: arm64
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - name: Install Docker Compose
        uses: ./.github/actions/setup-docker-compose
      - name: Run admission and ownership contracts
        run: |
          python3 -B -m unittest discover -s scripts -p test_foundation_recovery_proof.py
          python3 -B scripts/test_backup_repository_compose.py
      - name: Build the native foundation image
        run: |
          set -euo pipefail
          docker build --iidfile "$RUNNER_TEMP/foundation-image.id" infra/production/database
      - name: Check out the frozen pre-upgrade database source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 9a17509d802f8fa165b5988962f20ae18155fd73
          path: legacy-foundation
          sparse-checkout: infra/production/database
          persist-credentials: false
      - name: Build the ordinary legacy backup writer
        run: |
          set -euo pipefail
          docker build --iidfile "$RUNNER_TEMP/legacy-foundation-image.id" legacy-foundation/infra/production/database
      - name: Check out the frozen production baseline database source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: e514406f9ec774b6ede2524b9638480617c44a24
          path: previous-foundation
          sparse-checkout: infra/production/database
          persist-credentials: false
      - name: Build the PostgreSQL 18.4 pgBackRest 2.59.3 backup writer
        run: |
          set -euo pipefail
          docker build --iidfile "$RUNNER_TEMP/previous-foundation-image.id" previous-foundation/infra/production/database
      - name: Prove ordinary encrypted recovery and negative cases
        run: |
          set -euo pipefail
          image="$(cat "$RUNNER_TEMP/foundation-image.id")"
          python3 -B scripts/foundation-recovery-proof.py \
            --image "$image" \
            --state-directory "$RUNNER_TEMP/foundation-proof" \
            --receipt "$RUNNER_TEMP/foundation-recovery.json"
      - name: Prove ordinary encrypted backup compatibility from 2.57.0
        run: |
          set -euo pipefail
          python3 -B scripts/foundation-recovery-proof.py \
            --image "$(cat "$RUNNER_TEMP/foundation-image.id")" \
            --legacy-source-image "$(cat "$RUNNER_TEMP/legacy-foundation-image.id")" \
            --state-directory "$RUNNER_TEMP/foundation-legacy-proof" \
            --receipt "$RUNNER_TEMP/foundation-legacy-recovery.json"
      - name: Prove encrypted backup compatibility from the production baseline
        run: |
          set -euo pipefail
          python3 -B scripts/foundation-recovery-proof.py \
            --image "$(cat "$RUNNER_TEMP/foundation-image.id")" \
            --previous-source-image "$(cat "$RUNNER_TEMP/previous-foundation-image.id")" \
            --state-directory "$RUNNER_TEMP/foundation-previous-proof" \
            --receipt "$RUNNER_TEMP/foundation-previous-recovery.json"
      - name: Prove history preservation and independent repository transition
        run: |
          set -euo pipefail
          python3 -B scripts/foundation-repository-transition.py \
            --image "$(cat "$RUNNER_TEMP/foundation-image.id")" \
            --state-directory "$RUNNER_TEMP/foundation-transition-proof" \
            --receipt "$RUNNER_TEMP/foundation-transition.json"
      - name: Verify real resource cleanup on success, failure, timeout and interruption
        run: |
          set -euo pipefail
          FOUNDATION_PROOF_IMAGE="$(cat "$RUNNER_TEMP/foundation-image.id")"
          export FOUNDATION_PROOF_IMAGE
          python3 -B scripts/test_foundation_recovery_lifecycle_docker.py
          python3 - <<'PY'
          import json, os, pathlib
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'foundation-recovery.json'
          receipt = json.loads(path.read_text())
          receipt['lifecycleCasesPassed'] = 7
          path.write_text(json.dumps(receipt, indent=2) + '\n')
          PY
      - name: Clean only journaled proof resources after success or interruption
        if: ${{ always() }}
        run: |
          set -euo pipefail
          for state in "$RUNNER_TEMP/foundation-proof" "$RUNNER_TEMP/foundation-legacy-proof" "$RUNNER_TEMP/foundation-previous-proof" "$RUNNER_TEMP/foundation-lifetime"/*; do
            test -d "$state" || continue
            python3 -B scripts/foundation-recovery-proof.py --cleanup-only --state-directory "$state"
          done
          if test -d "$RUNNER_TEMP/foundation-transition-proof"; then
            python3 -B scripts/foundation-repository-transition.py --cleanup-only \
              --state-directory "$RUNNER_TEMP/foundation-transition-proof"
          fi
      - name: Retain recovery verdict without synthetic secrets
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: foundation-recovery-${{ matrix.architecture }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/foundation-recovery.json
            ${{ runner.temp }}/foundation-legacy-recovery.json
            ${{ runner.temp }}/foundation-previous-recovery.json
            ${{ runner.temp }}/foundation-transition.json
          if-no-files-found: ignore

  broker-upgrade:
    needs: plan
    if: ${{ needs.plan.outputs.required == 'true' }}
    name: Native broker data upgrade (${{ matrix.architecture }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            architecture: amd64
          - runner: ubuntu-24.04-arm
            architecture: arm64
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - name: Install Docker Compose
        uses: ./.github/actions/setup-docker-compose
      - name: Check resource ownership and failure cases
        run: python3 -B scripts/test_broker_upgrade_proof.py
      - name: Build the real application AMQP client
        env:
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
        run: |
          docker build --file apps/backend/Dockerfile --target backend-production \
            --build-arg INSIDE_RELEASE_VERSION=v1 --build-arg INSIDE_SOURCE_SHA="$SOURCE_SHA" \
            --tag inside-broker-proof-client:ci .
      - name: Prove persistent messages survive the supported 4.2 to 4.4 upgrade
        run: |
          python3 -B scripts/broker-upgrade-proof.py \
            --client-image inside-broker-proof-client:ci \
            --state-directory "$RUNNER_TEMP/broker-proof" \
            --receipt "$RUNNER_TEMP/broker-upgrade.json"
      - name: Clean only owned broker proof resources
        if: ${{ always() }}
        run: |
          if test -f "$RUNNER_TEMP/broker-proof/resources.json"; then
            python3 -B scripts/broker-upgrade-proof.py --cleanup-only \
              --state-directory "$RUNNER_TEMP/broker-proof"
          fi
      - name: Retain broker upgrade verdict
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: broker-upgrade-${{ matrix.architecture }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/broker-upgrade.json
          if-no-files-found: ignore
