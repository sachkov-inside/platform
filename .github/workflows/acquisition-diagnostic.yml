name: Acquisition diagnostic 1324

# Root adds this exact-head label once, only after a separate hosted grant.
on:
  pull_request:
    types: [labeled]
    branches: [main]

permissions:
  contents: read

jobs:
  acquisition:
    if: |
      ${{ github.event_name == 'pull_request' &&
          github.event.action == 'labeled' &&
          github.event.number == 1340 &&
          github.event.pull_request.base.ref == 'main' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.label.name == format('1324-acq-{0}', github.event.pull_request.head.sha) &&
          github.run_attempt == 1 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Record hosted identity
        run: python3 scripts/acquisition-diagnostic-hosted.py identity --output "$RUNNER_TEMP/1324-hosted"
      - name: Set up frozen Platform dependencies
        timeout-minutes: 10
        uses: ./.github/actions/setup-platform
      - name: Prove diagnostic mixed-UID meter closure
        timeout-minutes: 1
        env:
          ACQUISITION_DIAGNOSTIC_NATIVE_EPHEMERAL: "1"
        run: |
          node scripts/owned-node.mjs --command python3 scripts/acquisition-diagnostic-meter-native.py \
            --output "$RUNNER_TEMP/1324-hosted"
      - name: Run one acquisition guardian
        id: diagnostic
        timeout-minutes: 4
        env:
          ACQUISITION_DIAGNOSTIC_EPHEMERAL: "1"
        run: |
          node scripts/owned-node.mjs --command python3 scripts/acquisition-diagnostic-guard.py \
            --source-sha "$SOURCE_SHA" --output "$RUNNER_TEMP/1324-acquisition"
      - name: Qualify Linux native closure
        if: ${{ always() && steps.diagnostic.outcome != 'skipped' }}
        timeout-minutes: 1
        run: |
          sudo -n python3 scripts/acquisition-diagnostic-hosted.py close \
            --output "$RUNNER_TEMP/1324-hosted" --receipt "$RUNNER_TEMP/1324-acquisition/receipt.json"
      - name: Preserve exits and receipts
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: acquisition-1324-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/1324-hosted
            ${{ runner.temp }}/1324-acquisition
          if-no-files-found: error
          retention-days: 7

  # A separate Root grant proves native closure without starting acquisition.
  native-closure:
    if: |
      ${{ github.event_name == 'pull_request' &&
          github.event.action == 'labeled' &&
          github.event.number == 1340 &&
          github.event.pull_request.base.ref == 'main' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.label.name == format('1337-p2-{0}', github.event.pull_request.head.sha) &&
          github.run_attempt == 1 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Record hosted identity
        run: python3 scripts/acquisition-diagnostic-hosted.py identity --output "$RUNNER_TEMP/1337-native"
      - name: Install pinned Node.js for the dependency-free supervisor
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Prove native Linux closure without acquisition
        timeout-minutes: 1
        env:
          ACQUISITION_DIAGNOSTIC_NATIVE_EPHEMERAL: "1"
        run: |
          node scripts/owned-node.mjs --command python3 scripts/acquisition-diagnostic-meter-native.py \
            --output "$RUNNER_TEMP/1337-native"
      - name: Preserve native exits and receipts
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-closure-1337-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}-1
          path: ${{ runner.temp }}/1337-native
          if-no-files-found: error
          retention-days: 7
