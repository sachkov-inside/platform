name: Application CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4-alpine3.23@sha256:996d0920e4ff9df1fc19dacb904492f3c1ec0ec1cc338f0ad7123be7731c5f5e
        env:
          POSTGRES_DB: inside
          POSTGRES_USER: inside
          POSTGRES_PASSWORD: inside
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U inside -d inside"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgresql://inside:inside@127.0.0.1:5432/inside
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Install pnpm
        run: npm install --global "$(node -p "require('./package.json').packageManager")"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browser
        run: pnpm --filter @inside/web exec playwright install --with-deps chromium
      - name: Verify supported package and supply-chain baseline
        run: pnpm test:tooling
      - name: Verify repository and full stack
        env:
          API_HOST: 127.0.0.1
          API_PORT: "3001"
          BACKEND_BASE_URL: http://127.0.0.1:3001
        run: pnpm check:full

  compose-development-stack:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate and build every development image
        run: |
          docker compose --profile storybook config --quiet
          docker compose --profile storybook build
      - name: Start a clean development stack
        run: docker compose up --detach --wait
      - name: Verify the live stack
        run: bash scripts/compose-stack-smoke.sh
      - name: Stop while preserving PostgreSQL data
        run: docker compose down
      - name: Restart against the preserved volume
        run: docker compose up --detach --wait
      - name: Verify idempotent bootstrap and Compose Watch
        run: |
          bash scripts/compose-stack-smoke.sh
          bash scripts/compose-watch-smoke.sh
      - name: Stop the development stack
        if: always()
        run: docker compose down --remove-orphans
      - name: Reject orphan application containers
        if: always()
        run: test -z "$(docker compose ps --all --quiet)"
