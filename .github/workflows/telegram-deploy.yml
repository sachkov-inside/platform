name: Deploy Telegram production release

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Deploy the selected release or roll back to it
        required: true
        type: choice
        options:
          - deploy
          - rollback
      version:
        description: Existing immutable ordinal release (vN)
        required: true
        type: string

permissions: {}

concurrency:
  group: telegram-production-deployment
  queue: max

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: Production-Telegram
    permissions:
      actions: read
      contents: read
    steps:
      - name: Verify and download the selected release
        env:
          GH_TOKEN: ${{ github.token }}
          OPERATION: ${{ inputs.operation }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "$OPERATION" == deploy || "$OPERATION" == rollback ]]
          [[ "$VERSION" =~ ^v[1-9][0-9]*$ ]]
          [[ "$GITHUB_REPOSITORY" == sachkov-inside/platform && "$GITHUB_REF" == refs/heads/main ]]
          if [[ "${VERSION#v}" -le 5 ]]; then
            source_repository=sachkov-inside/inside-telegram
            tag="$VERSION"
            publication_workflow=.github/workflows/release.yml
          else
            source_repository=sachkov-inside/platform
            tag="telegram-$VERSION"
            publication_workflow=.github/workflows/telegram-release.yml
          fi
          echo "SOURCE_REPOSITORY=$source_repository" >>"$GITHUB_ENV"
          echo "RELEASE_TAG=$tag" >>"$GITHUB_ENV"
          release_dir="$RUNNER_TEMP/production-release"
          mkdir -m 700 "$release_dir"
          gh release view "$tag" --repo "$source_repository" \
            --json assets,isImmutable,tagName,targetCommitish \
            | jq '{
                assets: [.assets[].name] | sort,
                isImmutable,
                tagName,
                targetCommitish
              }' >"$release_dir/release.json"
          jq --exit-status --arg tag "$tag" '
            .isImmutable == true and
            .tagName == $tag and
            .assets == ["compose.yaml", "release-manifest.json", "telegram.caddy"]
          ' "$release_dir/release.json" >/dev/null
          gh release download "$tag" --repo "$source_repository" \
            --pattern release-manifest.json \
            --pattern compose.yaml \
            --pattern telegram.caddy \
            --dir "$release_dir"
          jq --exit-status \
            --arg repository "$source_repository" \
            --arg version "$VERSION" '
              .schemaVersion == "inside.telegram.release-manifest.v1" and
              .version == $version and
              .source.repository == $repository and
              (.source.sha | test("^[0-9a-f]{40}$")) and
              (.image | test("^ghcr\\.io/sachkov-inside/inside-telegram@sha256:[0-9a-f]{64}$")) and
              (.migrations.identity | test("^sha256:[0-9a-f]{64}$")) and
              .compose.asset == "compose.yaml" and
              (.compose.sha256 | test("^sha256:[0-9a-f]{64}$")) and
              .caddy.asset == "telegram.caddy" and
              (.caddy.sha256 | test("^sha256:[0-9a-f]{64}$")) and
              (.publication.workflowRunId | type == "number") and
              (.publication.workflowRunId | . > 0 and floor == .) and
              .publication.workflowRunUrl == ("https://github.com/" + $repository + "/actions/runs/" + (.publication.workflowRunId | tostring))
            ' "$release_dir/release-manifest.json" >/dev/null
          expected_compose_sha="$(jq --raw-output .compose.sha256 "$release_dir/release-manifest.json")"
          actual_compose_sha="sha256:$(sha256sum "$release_dir/compose.yaml" | cut -d' ' -f1)"
          [[ "$actual_compose_sha" == "$expected_compose_sha" ]]
          expected_caddy_sha="$(jq --raw-output .caddy.sha256 "$release_dir/release-manifest.json")"
          actual_caddy_sha="sha256:$(sha256sum "$release_dir/telegram.caddy" | cut -d' ' -f1)"
          [[ "$actual_caddy_sha" == "$expected_caddy_sha" ]]
          source_sha="$(jq --raw-output .source.sha "$release_dir/release-manifest.json")"
          [[ "$(jq --raw-output .targetCommitish "$release_dir/release.json")" == "$source_sha" ]]
          tag_sha="$(gh api "repos/$source_repository/commits/$tag" --jq .sha)"
          [[ "$tag_sha" == "$source_sha" ]]
          publish_run_id="$(jq --raw-output .publication.workflowRunId "$release_dir/release-manifest.json")"
          gh api "repos/$source_repository/actions/runs/$publish_run_id" \
            >"$release_dir/publication-run.json"
          jq --exit-status --arg source_sha "$source_sha" \
            --arg repository "$source_repository" --arg workflow "$publication_workflow" \
            --argjson runId "$publish_run_id" '
            .id == $runId and
            .conclusion == "success" and
            .event == "workflow_dispatch" and
            .head_branch == "main" and
            .head_sha == $source_sha and
            .path == $workflow and
            .repository.full_name == $repository and
            .head_repository.full_name == $repository and
            .html_url == ("https://github.com/" + $repository + "/actions/runs/" + ($runId | tostring))
          ' "$release_dir/publication-run.json" >/dev/null
          echo "RELEASE_DIR=$release_dir" >>"$GITHUB_ENV"

      - name: Install the restricted SSH identity
        env:
          PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
          SSH_HOST_KEYS: ${{ secrets.PRODUCTION_SSH_HOST_KEYS }}
        run: |
          set -euo pipefail
          install -m 600 /dev/null "$RUNNER_TEMP/telegram-deploy-key"
          printf '%s\n' "$PRIVATE_KEY" >"$RUNNER_TEMP/telegram-deploy-key"
          install -m 600 /dev/null "$RUNNER_TEMP/telegram-known-hosts"
          printf '%s\n' "$SSH_HOST_KEYS" >"$RUNNER_TEMP/telegram-known-hosts"

      - name: Recheck the selected release after waiting in the queue
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --repo "$SOURCE_REPOSITORY" \
            --json assets,isImmutable,tagName,targetCommitish \
            | jq '{
                assets: [.assets[].name] | sort,
                isImmutable,
                tagName,
                targetCommitish
              }' >"$RUNNER_TEMP/rechecked-release.json"
          cmp "$RELEASE_DIR/release.json" "$RUNNER_TEMP/rechecked-release.json"

      - name: Run the restricted server operation
        env:
          OPERATION: ${{ inputs.operation }}
          VERSION: ${{ inputs.version }}
          SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
        run: |
          set -euo pipefail
          tar -C "$RELEASE_DIR" -czf "$RUNNER_TEMP/payload.tar.gz" \
            release-manifest.json compose.yaml telegram.caddy
          ssh \
            -i "$RUNNER_TEMP/telegram-deploy-key" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=30 \
            -o ConnectionAttempts=3 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=8 \
            -o "UserKnownHostsFile=$RUNNER_TEMP/telegram-known-hosts" \
            "inside-telegram-deploy@$SSH_HOST" \
            "$OPERATION $VERSION $GITHUB_RUN_ID" \
            <"$RUNNER_TEMP/payload.tar.gz"
