name: Publish ordinal release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Next ordinal release (vN)
        required: true
        type: string
      vulnerability_waiver_reason:
        description: Auditable reason for accepting high or critical findings
        required: false
        type: string

permissions: {}

concurrency:
  group: platform-release
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      source_sha: ${{ steps.plan.outputs.source_sha }}
      version: ${{ steps.plan.outputs.version }}
    permissions:
      contents: read
    steps:
      - name: Check out captured source
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@v6.0.10
      - name: Install Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install release contract dependencies
        run: pnpm install --frozen-lockfile --filter . --prod
      - name: Require immutable ordinal history and current main
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          bash scripts/plan-release.sh >release-plan.json
          echo "source_sha=$(jq --raw-output .sourceSha release-plan.json)" >>"$GITHUB_OUTPUT"
          echo "version=$(jq --raw-output .version release-plan.json)" >>"$GITHUB_OUTPUT"

  ci:
    needs: plan
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      source_sha: ${{ needs.plan.outputs.source_sha }}

  build-images:
    needs:
      - plan
      - ci
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
      packages: write
    uses: ./.github/workflows/build-release-images.yml
    with:
      source_sha: ${{ needs.plan.outputs.source_sha }}
      version: ${{ needs.plan.outputs.version }}
      vulnerability_waiver_reason: ${{ inputs.vulnerability_waiver_reason }}

  finalize:
    needs:
      - plan
      - ci
      - build-images
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      attestations: read
      contents: write
    steps:
      - name: Check out captured source
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@v6.0.10
      - name: Install Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install release contract dependencies
        run: pnpm install --frozen-lockfile --filter . --prod
      - name: Download verified image data
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: release-image-*
          path: release-assets
          merge-multiple: true
      - name: Recheck release state
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ needs.plan.outputs.version }}
          SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
        run: |
          bash scripts/plan-release.sh >"$RUNNER_TEMP/release-plan.json"
      - name: Create immutable manifest
        env:
          SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          jq --null-input \
            --arg version "$VERSION" \
            --arg sourceSha "$SOURCE_SHA" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg backend release-assets/backend.image.json \
            --arg web release-assets/web.image.json \
            '{
              version: $version,
              sourceSha: $sourceSha,
              repository: $repository,
              images: {backend: $backend, web: $web}
            }' >"$RUNNER_TEMP/release-manifest-input.json"
          node scripts/release-contract.mjs manifest \
            --input "$RUNNER_TEMP/release-manifest-input.json" \
            >release-assets/release-manifest.json
      - name: Reverify standard image attestations
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
        run: |
          while IFS= read -r image_reference; do
            bash scripts/verify-release-attestations.sh \
              "$image_reference" \
              "$SOURCE_SHA"
          done < <(jq --raw-output '.images.backend, .images.web' release-assets/release-manifest.json)
      - name: Publish immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          jq --raw-output '
            "Source: `" + .source.sha + "`\n\n" +
            "Backend: `" + .images.backend + "`\n\n" +
            "Web: `" + .images.web + "`"
          ' release-assets/release-manifest.json >"$RUNNER_TEMP/release-notes.md"
          gh release create "$VERSION" \
            --target "$SOURCE_SHA" \
            --title "$VERSION" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --latest \
            release-assets/release-manifest.json \
            release-assets/backend.vulnerabilities.json \
            release-assets/web.vulnerabilities.json
