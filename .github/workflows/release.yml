name: Publish ordinal release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Next ordinal release (vN)
        required: true
        type: string

permissions: {}

concurrency:
  group: platform-release
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      image_matrix: ${{ steps.plan.outputs.image_matrix }}
      manifest_asset_name: ${{ steps.plan.outputs.manifest_asset_name }}
      source_sha: ${{ steps.plan.outputs.source_sha }}
      version: ${{ steps.plan.outputs.version }}
    permissions:
      contents: read
    steps:
      - name: Check out captured source
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@v6.0.10
      - name: Install Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install release contract dependencies
        run: pnpm install --frozen-lockfile --filter . --prod
      - name: Require immutable ordinal history and current main
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          bash scripts/plan-release.sh >release-plan.json
          echo "image_matrix=$(jq --compact-output .imageMatrix release-plan.json)" >>"$GITHUB_OUTPUT"
          echo "manifest_asset_name=$(jq --raw-output .manifestAssetName release-plan.json)" >>"$GITHUB_OUTPUT"
          echo "source_sha=$(jq --raw-output .sourceSha release-plan.json)" >>"$GITHUB_OUTPUT"
          echo "version=$(jq --raw-output .version release-plan.json)" >>"$GITHUB_OUTPUT"

  ci:
    needs: plan
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      source_sha: ${{ needs.plan.outputs.source_sha }}

  build-images:
    needs:
      - plan
      - ci
    name: Build and publish ${{ matrix.kind }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.image_matrix) }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out captured source
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.3.0
      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push exact source
        id: build
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: true
          build-args: |
            INSIDE_RELEASE_VERSION=${{ needs.plan.outputs.version }}
            INSIDE_SOURCE_SHA=${{ needs.plan.outputs.source_sha }}
          tags: ${{ matrix.imageName }}:${{ needs.plan.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.plan.outputs.source_sha }}
            org.opencontainers.image.version=${{ needs.plan.outputs.version }}
          provenance: false
          sbom: false
      - name: Prepare release data directory
        run: mkdir -p release-data
      - name: Record published image
        env:
          IMAGE_NAME: ${{ matrix.imageName }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          KIND: ${{ matrix.kind }}
          SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
        run: |
          jq --null-input \
            --arg imageName "$IMAGE_NAME" \
            --arg imageDigest "$IMAGE_DIGEST" \
            --arg sourceSha "$SOURCE_SHA" \
            '{
              image: {name: $imageName, digest: $imageDigest},
              sourceSha: $sourceSha
            }' >"release-data/${KIND}.image.json"
      - name: Prove public digest access
        env:
          IMAGE_NAME: ${{ matrix.imageName }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker logout ghcr.io
          docker buildx imagetools inspect "${IMAGE_NAME}@${IMAGE_DIGEST}"
      - name: Upload published image data
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-image-${{ matrix.kind }}
          path: release-data/${{ matrix.kind }}.image.json
          if-no-files-found: error
          retention-days: 7

  finalize:
    needs:
      - plan
      - ci
      - build-images
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out captured source
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@v6.0.10
      - name: Install Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install release contract dependencies
        run: pnpm install --frozen-lockfile --filter . --prod
      - name: Download published image data
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: release-image-*
          path: release-assets
          merge-multiple: true
      - name: Recheck release state
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ needs.plan.outputs.version }}
          SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
        run: |
          bash scripts/plan-release.sh >"$RUNNER_TEMP/release-plan.json"
      - name: Create immutable manifest
        env:
          MANIFEST_ASSET_NAME: ${{ needs.plan.outputs.manifest_asset_name }}
          SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          jq --null-input \
            --arg version "$VERSION" \
            --arg sourceSha "$SOURCE_SHA" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg backend release-assets/backend.image.json \
            --arg web release-assets/web.image.json \
            '{
              version: $version,
              sourceSha: $sourceSha,
              repository: $repository,
              images: {backend: $backend, web: $web}
            }' >"$RUNNER_TEMP/release-manifest-input.json"
          node scripts/release-contract.mjs manifest \
            --input "$RUNNER_TEMP/release-manifest-input.json" \
            >"release-assets/${MANIFEST_ASSET_NAME}"
      - name: Publish immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          MANIFEST_ASSET_NAME: ${{ needs.plan.outputs.manifest_asset_name }}
          SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          jq --raw-output '
            "Source: `" + .source.sha + "`\n\n" +
            "Backend: `" + .images.backend + "`\n\n" +
            "Web: `" + .images.web + "`"
          ' "release-assets/${MANIFEST_ASSET_NAME}" >"$RUNNER_TEMP/release-notes.md"
          gh release create "$VERSION" \
            --target "$SOURCE_SHA" \
            --title "$VERSION" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --latest \
            "release-assets/${MANIFEST_ASSET_NAME}"
