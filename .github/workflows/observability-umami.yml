name: Umami functional pilot

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/observability-umami.yml
      - infra/observability/umami/**
      - infra/production/database/**
      - infra/observability/pilot/probe.lock.json
      - scripts/observability-umami/**
      - scripts/observability-umami*.test.mjs
      - scripts/observability-pilot/**
      - scripts/process-group-signal.mjs
      - scripts/heavy-check.sh
      - docs/runbooks/observability-umami-pilot.md
      - .node-version

permissions:
  contents: read

concurrency:
  group: umami-pilot-${{ github.event.pull_request.number }}${{ github.run_attempt > 1 && format('-rerun-{0}', github.run_id) || '' }}
  cancel-in-progress: true

env:
  CI: "true"
  PYTHONDONTWRITEBYTECODE: "1"
  PILOT_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
  PILOT_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}

jobs:
  scope:
    name: Select assigned observability scope
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: scope
        run: python3 scripts/observability-production/production.py select-scope >> "$GITHUB_OUTPUT"

  functional:
    needs: scope
    if: ${{ needs.scope.result == 'success' && needs.scope.outputs.scope != 'technical' }}
    name: Isolated Umami functional smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pinned host Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Verify local API and process ownership contracts
        timeout-minutes: 2
        run: bash scripts/heavy-check.sh node --test scripts/observability-umami.test.mjs scripts/observability-umami-process.test.mjs
      - name: Record exact source and measured Docker disk admission
        timeout-minutes: 1
        run: >-
          python3 scripts/observability-umami/hosted.py admission
          --output "$RUNNER_TEMP/inside-umami-private"
          --metadata "$RUNNER_TEMP/inside-umami-metadata"
          --public "$RUNNER_TEMP/inside-umami-public"
      - name: Run synthetic Umami through external supervisor
        timeout-minutes: 20
        run: >-
          bash scripts/heavy-check.sh python3 scripts/observability-umami/runtime.py run
          --output "$RUNNER_TEMP/inside-umami-private"
      - name: Recover only registered project on the same daemon
        if: ${{ always() }}
        timeout-minutes: 5
        run: >-
          python3 scripts/observability-umami/hosted.py recover
          --output "$RUNNER_TEMP/inside-umami-private"
          --metadata "$RUNNER_TEMP/inside-umami-metadata"
          --public "$RUNNER_TEMP/inside-umami-public"
      - name: Collect explicit public evidence whitelist
        if: ${{ always() }}
        timeout-minutes: 1
        run: >-
          python3 scripts/observability-umami/hosted.py collect
          --output "$RUNNER_TEMP/inside-umami-private"
          --metadata "$RUNNER_TEMP/inside-umami-metadata"
          --public "$RUNNER_TEMP/inside-umami-public"
      - name: Upload curated evidence
        if: ${{ always() }}
        timeout-minutes: 2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: umami-functional-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/inside-umami-public
          if-no-files-found: warn
          retention-days: 7

  recovery:
    needs: scope
    if: ${{ needs.scope.result == 'success' && needs.scope.outputs.scope != 'technical' }}
    name: Isolated PG18 pgBackRest recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pinned host Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Verify source, restore and maintenance contracts
        timeout-minutes: 2
        run: bash scripts/heavy-check.sh python3 -B -m unittest discover -s scripts/observability-umami -p 'test_*.py'
      - name: Bind exact source and measured Docker disk admission
        timeout-minutes: 1
        run: >-
          python3 scripts/observability-umami/hosted.py admission --recovery
          --output "$RUNNER_TEMP/inside-umami-recovery-private"
          --metadata "$RUNNER_TEMP/inside-umami-recovery-metadata"
          --public "$RUNNER_TEMP/inside-umami-recovery-public"
      - name: Build current source-bound foundation without publication
        timeout-minutes: 12
        run: >-
          bash scripts/heavy-check.sh python3 -B scripts/observability-umami/foundation.py
          --output "$RUNNER_TEMP/inside-umami-recovery-foundation.json"
      - name: Run actual backup and isolated restore through public supervisor
        timeout-minutes: 20
        run: >-
          bash scripts/heavy-check.sh python3 -B scripts/observability-umami/recovery_runtime.py run
          --output "$RUNNER_TEMP/inside-umami-recovery-private"
          --foundation-cache "$RUNNER_TEMP/inside-umami-recovery-foundation.json"
      - name: Recover only the registered recovery project on its daemon
        if: ${{ always() }}
        timeout-minutes: 5
        run: >-
          python3 scripts/observability-umami/hosted.py recover --recovery
          --output "$RUNNER_TEMP/inside-umami-recovery-private"
          --metadata "$RUNNER_TEMP/inside-umami-recovery-metadata"
          --public "$RUNNER_TEMP/inside-umami-recovery-public"
      - name: Collect only curated recovery and exact-source evidence
        if: ${{ always() }}
        timeout-minutes: 1
        run: >-
          python3 scripts/observability-umami/hosted.py collect --recovery
          --output "$RUNNER_TEMP/inside-umami-recovery-private"
          --metadata "$RUNNER_TEMP/inside-umami-recovery-metadata"
          --public "$RUNNER_TEMP/inside-umami-recovery-public"
      - name: Upload curated recovery evidence
        if: ${{ always() }}
        timeout-minutes: 2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: umami-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/inside-umami-recovery-public
          if-no-files-found: warn
          retention-days: 7
