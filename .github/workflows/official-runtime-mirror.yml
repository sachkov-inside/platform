name: Publish official PostgreSQL and Node mirrors

# Owner-approved #1396 packet: 65c84186ced7744f790fb05000be2ca00f01146c6c2d3a6b9e944d38e013faa2.
# Publishing runs only from trusted main; no candidate code or image input is accepted.
on:
  push:
    branches: [main]
    paths: [.github/workflows/official-runtime-mirror.yml]
  workflow_dispatch:

permissions: {}

concurrency:
  group: official-runtime-mirror
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.repository == 'sachkov-inside/platform' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      packages: write
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        include:
          - image: postgres
            tag: 18.4-alpine
            digest: sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
          - image: postgres
            tag: 18.4-alpine3.23
            digest: sha256:996d0920e4ff9df1fc19dacb904492f3c1ec0ec1cc338f0ad7123be7731c5f5e
          - image: node
            tag: 26.10.0-alpine3.24
            digest: sha256:0b36e8c136b94cd4fcf02188228e76c31ad5872eef3fec8cbd2eee500cfd9e80
    steps:
      # No candidate checkout, artifact, repository secret or arbitrary image input.
      - name: Install registry copier
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends skopeo
      - name: Copy the complete official index without changing digests
        env:
          GHCR_TOKEN: ${{ github.token }}
          GHCR_USER: ${{ github.actor }}
          IMAGE_NAME: ${{ matrix.image }}
          IMAGE_TAG: ${{ matrix.tag }}
          IMAGE_DIGEST: ${{ matrix.digest }}
        run: |
          set -euo pipefail
          auth_file="$RUNNER_TEMP/official-runtime-auth.json"
          trap 'rm -f "$auth_file"' EXIT
          printf '%s' "$GHCR_TOKEN" | skopeo login --authfile "$auth_file" \
            --username "$GHCR_USER" --password-stdin ghcr.io
          unset GHCR_TOKEN
          skopeo copy --all --preserve-digests --retry-times 0 --authfile "$auth_file" \
            "docker://docker.io/library/$IMAGE_NAME@$IMAGE_DIGEST" \
            "docker://ghcr.io/sachkov-inside/$IMAGE_NAME:$IMAGE_TAG"
      - name: Require public reading and identical index and platform manifests
        env:
          IMAGE_NAME: ${{ matrix.image }}
          IMAGE_TAG: ${{ matrix.tag }}
          IMAGE_DIGEST: ${{ matrix.digest }}
        run: |
          set -euo pipefail
          proof="$RUNNER_TEMP/official-runtime-proof-$IMAGE_NAME-$IMAGE_TAG"
          mkdir -p "$proof"
          printf '{"auths":{}}\n' >"$proof/anonymous.json"
          skopeo inspect --raw --authfile "$proof/anonymous.json" \
            "docker://docker.io/library/$IMAGE_NAME@$IMAGE_DIGEST" >"$proof/upstream-index.json"
          skopeo inspect --raw --authfile "$proof/anonymous.json" \
            "docker://ghcr.io/sachkov-inside/$IMAGE_NAME:$IMAGE_TAG" >"$proof/ghcr-index.json"
          printf '%s  %s\n' "${IMAGE_DIGEST#sha256:}" "$proof/ghcr-index.json" | sha256sum --check
          cmp "$proof/upstream-index.json" "$proof/ghcr-index.json"
          jq --exit-status 'any(.manifests[]; .platform.os == "linux" and .platform.architecture == "amd64") and any(.manifests[]; .platform.os == "linux" and .platform.architecture == "arm64")' "$proof/ghcr-index.json"
          jq --raw-output '.manifests[].digest' "$proof/upstream-index.json" >"$proof/platform-digests.txt"
          while IFS= read -r digest; do
            skopeo inspect --raw --authfile "$proof/anonymous.json" \
              "docker://docker.io/library/$IMAGE_NAME@$digest" >"$proof/upstream-${digest#sha256:}.json"
            skopeo inspect --raw --authfile "$proof/anonymous.json" \
              "docker://ghcr.io/sachkov-inside/$IMAGE_NAME@$digest" >"$proof/ghcr-${digest#sha256:}.json"
            cmp "$proof/upstream-${digest#sha256:}.json" "$proof/ghcr-${digest#sha256:}.json"
          done <"$proof/platform-digests.txt"
      - name: Keep mirror identity evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: official-runtime-mirror-${{ matrix.image }}-${{ matrix.tag }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/official-runtime-proof-${{ matrix.image }}-${{ matrix.tag }}
          if-no-files-found: warn
          retention-days: 7
