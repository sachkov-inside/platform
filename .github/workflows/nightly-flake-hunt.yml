name: Nightly flake hunt

on:
  schedule:
    - cron: "43 2 * * *"
  workflow_dispatch:
    inputs:
      fixture:
        description: Run only the deliberately alternating test to exercise reporting
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: platform-nightly-flake-hunt-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: "true"

jobs:
  tests:
    name: Flake hunt (${{ matrix.suite }})
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.minutes }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include: ${{ fromJSON(inputs.fixture && '[{"suite":"fixture","minutes":10}]' || '[{"suite":"web-e2e","minutes":90},{"suite":"storybook","minutes":60},{"suite":"browser-engines","minutes":60},{"suite":"integration","minutes":120},{"suite":"unit","minutes":90}]') }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Platform
        uses: ./.github/actions/setup-platform
        with:
          browsers: ${{ (matrix.suite == 'web-e2e' || matrix.suite == 'storybook' || matrix.suite == 'browser-engines') && 'chromium webkit' || '' }}
      - name: Build production applications once
        if: ${{ matrix.suite == 'web-e2e' }}
        run: pnpm build
      - name: Run five independent samples without retries
        env:
          FLAKE_SUITE: ${{ matrix.suite }}
        run: node scripts/run-nightly-flake-hunt.mjs "$FLAKE_SUITE" ci-artifacts/flake-hunt
      - name: Summarize observed test outcomes
        if: ${{ always() }}
        run: node scripts/nightly-flake-report.mjs ci-artifacts/flake-hunt
      - name: Upload every sample and its diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flake-${{ matrix.suite }}-${{ github.run_attempt }}
          path: ci-artifacts/flake-hunt
          if-no-files-found: error
          retention-days: 7

  report-failures:
    name: Report main test failures
    needs: tests
    # This job never executes branch or PR code with its write token.
    if: ${{ always() && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out the trusted main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Platform
        uses: ./.github/actions/setup-platform
      - name: Download test data from this run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: flake-*-${{ github.run_attempt }}
          path: ci-artifacts/flake-hunt
      - name: Open or update one issue per failed test and write summary
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/nightly-flake-report.mjs ci-artifacts/flake-hunt --publish
