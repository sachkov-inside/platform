name: Application CI

on:
  pull_request:
    branches:
      - main
  workflow_call:
    inputs:
      source_sha:
        description: Exact commit to verify
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: platform-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  CI: "true"

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@v6.0.10
      - name: Install Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm --filter @inside/web exec playwright install --with-deps chromium
      - name: Run repository checks
        run: pnpm check
      - name: Upload Playwright diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: quality-playwright-${{ github.run_attempt }}
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore
          retention-days: 7

  integration:
    name: Integration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@v6.0.10
      - name: Install Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run isolated integration tests
        run: pnpm test:integration

  compose-development:
    name: Development Compose
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      COMPOSE_PROJECT_NAME: inside-platform-development-${{ github.run_id }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - name: Validate and build profile topology
        run: |
          docker compose --profile storybook config --quiet
          docker compose --profile storybook build
      - name: Run clean stack smoke and write persistence probes
        run: |
          docker compose up --detach --wait
          bash scripts/compose-stack-smoke.sh
          docker compose exec -T postgres psql \
            --username inside \
            --dbname inside \
            --set ON_ERROR_STOP=1 \
            --command "create schema ci_smoke; create table ci_smoke.persistence_probe (marker text primary key); insert into ci_smoke.persistence_probe values ('survived-restart');"
          docker compose exec -T object-storage sh -ec \
            'mc alias set ci http://127.0.0.1:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" >/dev/null; mc mb --ignore-existing ci/inside-ci >/dev/null; printf survived-restart | mc pipe ci/inside-ci/persistence-probe.txt >/dev/null'
      - name: Prove restart persistence and clean shutdown
        run: |
          docker compose down
          docker compose up --detach --wait
          postgres_marker="$(docker compose exec -T postgres psql \
            --username inside \
            --dbname inside \
            --tuples-only \
            --no-align \
            --command "select marker from ci_smoke.persistence_probe;")"
          test "$postgres_marker" = "survived-restart"
          object_storage_marker="$(docker compose exec -T object-storage sh -ec \
            'mc alias set ci http://127.0.0.1:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" >/dev/null; mc cat ci/inside-ci/persistence-probe.txt')"
          test "$object_storage_marker" = "survived-restart"
          bash scripts/compose-stack-smoke.sh
          docker compose down --remove-orphans
          test -z "$(docker compose ps --all --quiet)"
      - name: Capture failure diagnostics
        if: ${{ failure() }}
        run: |
          mkdir -p ci-artifacts/compose-development
          docker compose ps --all >ci-artifacts/compose-development/compose-ps.txt 2>&1 || true
          docker compose logs --no-color --tail 500 >ci-artifacts/compose-development/compose.log 2>&1 || true
      - name: Upload failure diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: compose-development-diagnostics-${{ github.run_attempt }}
          path: ci-artifacts/compose-development
          if-no-files-found: ignore
          retention-days: 7
      - name: Remove development stack
        if: ${{ always() }}
        run: docker compose down --volumes --remove-orphans

  compose-production:
    name: Production Compose
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .node-version
      - name: Install pnpm
        uses: pnpm/action-setup@v6.0.10
      - name: Run isolated production smoke
        env:
          PRODUCTION_SMOKE_ARTIFACT_DIR: ci-artifacts/compose-production
        run: pnpm compose:production:smoke
      - name: Build and inspect release images
        run: pnpm release:images:smoke
      - name: Upload failure diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: compose-production-diagnostics-${{ github.run_attempt }}
          path: ci-artifacts/compose-production
          if-no-files-found: ignore
          retention-days: 7

  ci-gate:
    name: CI Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: ${{ always() }}
    needs:
      - quality
      - integration
      - compose-development
      - compose-production
    steps:
      - name: Require every CI job
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          COMPOSE_DEVELOPMENT_RESULT: ${{ needs.compose-development.result }}
          COMPOSE_PRODUCTION_RESULT: ${{ needs.compose-production.result }}
        run: |
          for result in \
            "$QUALITY_RESULT" \
            "$INTEGRATION_RESULT" \
            "$COMPOSE_DEVELOPMENT_RESULT" \
            "$COMPOSE_PRODUCTION_RESULT"
          do
            if [[ "$result" != "success" ]]; then
              echo "A required CI job finished with result: $result" >&2
              exit 1
            fi
          done
