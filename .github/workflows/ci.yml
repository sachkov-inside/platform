name: Application CI

on:
  pull_request:
    branches:
      - main
  merge_group:
  workflow_call:
    inputs:
      source_sha:
        description: Exact commit to verify
        required: true
        type: string
      coverage_json:
        description: JSON array of missing release coverage IDs; absent means complete coverage
        required: false
        type: string

permissions:
  contents: read

concurrency:
  # Reruns have their own group: recovery can race a new commit after its API
  # freshness check, and must not cancel that commit's first attempt (#1085).
  group: platform-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.event.merge_group.head_ref || github.run_id }}${{ github.run_attempt > 1 && format('-rerun-{0}', github.run_id) || '' }}
  cancel-in-progress: true

env:
  CI: "true"

jobs:
  review-evidence:
    permissions:
      contents: read
      pull-requests: read
      issues: read
    name: Independent review evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      status: ${{ steps.review.outputs.status || steps.release.outputs.status }}
    steps:
      - name: Preserve release coverage applicability
        id: release
        if: ${{ inputs.source_sha != '' }}
        run: |
          echo 'status=release-not-applicable' >> "$GITHUB_OUTPUT"
          echo 'Review evidence: release-not-applicable. Integration review belongs to PR and merge queue; release source coverage remains mandatory.' >> "$GITHUB_STEP_SUMMARY"
      - name: Select trusted review source
        id: review-source
        if: ${{ inputs.source_sha == '' }}
        env:
          REVIEW_EVENT_NAME: ${{ github.event_name }}
          REVIEW_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          REVIEW_QUEUE_BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: |
          case "$REVIEW_EVENT_NAME" in
            pull_request) base="$REVIEW_PR_BASE_SHA" ;;
            merge_group) base="$REVIEW_QUEUE_BASE_SHA" ;;
            *) echo 'Unsupported review event' >&2; exit 1 ;;
          esac
          if ! [[ "$base" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'Missing or invalid authoritative review base' >&2
            exit 1
          fi
          source="$base"
          migration=false
          if test "$base" = cfa6b52fed6792f67affcb1ab245c2ec591dd016; then
            source=0d7693f6774abdf5d13fc278d6026e05ed9a0efe
            migration=true
          fi
          echo "source_sha=$source" >> "$GITHUB_OUTPUT"
          echo "migration=$migration" >> "$GITHUB_OUTPUT"
      - name: Check out trusted target rules
        if: ${{ inputs.source_sha == '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.review-source.outputs.source_sha }}
          path: review-trusted
          persist-credentials: false
      - name: Validate trusted review checkout
        if: ${{ inputs.source_sha == '' }}
        working-directory: review-trusted
        env:
          REVIEW_TRUSTED_SOURCE: ${{ steps.review-source.outputs.source_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$REVIEW_TRUSTED_SOURCE"
          if test "$REVIEW_TRUSTED_SOURCE" = 0d7693f6774abdf5d13fc278d6026e05ed9a0efe; then
            digest="$(sha256sum scripts/review-evidence.mjs)"
            test "${digest%% *}" = a925df89ac1d67fc36f89875be5193ff33c61d75a2332583b30d83a80924ba36
          fi
      - name: Check out candidate as data
        if: ${{ inputs.source_sha == '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: review-candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Install trusted verifier runtime
        if: ${{ inputs.source_sha == '' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.10.0"
      - name: Verify migration queue read capability
        if: ${{ inputs.source_sha == '' && steps.review-source.outputs.migration == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          const query = 'query ReviewQueueCapability($owner:String!,$name:String!) { repository(owner:$owner,name:$name) { mergeQueue(branch:"main") { entries(first:1) { nodes { headCommit { oid } pullRequest { number headRefOid } } } } } }';
          const object = (value) => value !== null && typeof value === 'object' && !Array.isArray(value);
          const sha = (value) => typeof value === 'string' && /^[0-9a-f]{40}$/.test(value);
          try {
            const token = process.env.GH_TOKEN;
            const repository = process.env.GITHUB_REPOSITORY?.split('/');
            if (!token || repository?.length !== 2 || !repository.every((part) => /^[A-Za-z0-9_.-]+$/.test(part))) throw new Error();
            const queueProbeTimeoutMilliseconds = 10000;
            const response = await fetch('https://api.github.com/graphql', {
              method: 'POST',
              headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
              body: JSON.stringify({ query, variables: { owner: repository[0], name: repository[1] } }),
              signal: AbortSignal.timeout(queueProbeTimeoutMilliseconds),
            });
            if (response.status !== 200) throw new Error();
            const result = await response.json();
            if (!object(result) || Object.hasOwn(result, 'errors') || !object(result.data) || !object(result.data.repository)) throw new Error();
            const queue = result.data.repository.mergeQueue;
            if (!object(queue) || !object(queue.entries) || !Array.isArray(queue.entries.nodes) || queue.entries.nodes.length > 1) throw new Error();
            for (const entry of queue.entries.nodes) {
              if (!object(entry) || !(entry.headCommit === null || (object(entry.headCommit) && sha(entry.headCommit.oid))) || !object(entry.pullRequest) || !Number.isSafeInteger(entry.pullRequest.number) || entry.pullRequest.number <= 0 || !sha(entry.pullRequest.headRefOid)) throw new Error();
            }
            console.log('GitHub queue read capability verified; positive queue integration remains unproven.');
          } catch {
            console.error('GitHub queue read capability probe failed.');
            process.exitCode = 1;
          }
          NODE
      - name: Verify current GitHub reviews under trusted target rules
        id: review
        if: ${{ inputs.source_sha == '' }}
        working-directory: review-candidate
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_CANDIDATE_SHA: ${{ github.sha }}
        run: |
          if test -f ../review-trusted/scripts/review-evidence.mjs; then
            node ../review-trusted/scripts/review-evidence.mjs verify
          else
            echo 'status=bootstrap-prior-policy' >> "$GITHUB_OUTPUT"
            echo 'Review evidence: bootstrap-prior-policy. Trusted target has not adopted this verifier. Prior-policy independent Standards/Spec review and owner approval of prepared controls are required before adoption.' >> "$GITHUB_STEP_SUMMARY"
          fi

  security:
    name: Secrets and production advisories
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Platform
        uses: ./.github/actions/setup-platform
      - name: Verify scanner rejection and source security
        env:
          QUALITY_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: pnpm quality:proof secrets && pnpm quality:security

  plan:
    name: Coverage plan (isolated reruns)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      plan_sha256: ${{ steps.select.outputs.plan_sha256 }}
      required: ${{ steps.select.outputs.required }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Select complete changed-set coverage
        id: select
        env:
          CI_EVENT: ${{ inputs.source_sha != '' && 'release' || github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          COVERAGE_JSON: ${{ inputs.coverage_json }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: node scripts/ci-coverage-run.mjs plan

  docs:
    name: Documentation contracts
    needs: plan
    if: ${{ contains(fromJSON(needs.plan.outputs.required), 'docs') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Platform
        uses: ./.github/actions/setup-platform
      - name: Verify selected contracts
        run: pnpm docs:check

  contracts:
    name: Tooling contracts
    needs: plan
    if: ${{ contains(fromJSON(needs.plan.outputs.required), 'contracts') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Platform
        uses: ./.github/actions/setup-platform
      - name: Verify selected contracts
        run: pnpm test:tooling && pnpm test:contracts

  static:
    needs: plan
    if: ${{ contains(fromJSON(needs.plan.outputs.required), 'static') }}
    # Recovery requires this name so pre-#1085 workflows without rerun isolation
    # cannot be retried after recovery is enabled on the default branch.
    name: Static checks (isolated reruns)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          # docs:check compares added lines with the merge base of origin/main.
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Platform
        uses: ./.github/actions/setup-platform
      - name: Run static checks
        run: pnpm check:static

  unit-checks:
    needs: plan
    if: ${{ contains(fromJSON(needs.plan.outputs.required), 'unit') }}
    name: Unit checks (${{ matrix.part }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        part: [tooling, modules, contracts]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - name: Set up Platform
        uses: ./.github/actions/setup-platform
      - name: Run tooling, authoring and practice-review tests
        if: ${{ matrix.part == 'tooling' }}
        env:
          INSIDE_CORE_SOURCE_PROGRESS: "1"
        run: pnpm check:unit:tooling
      - name: Run application and package unit tests
        if: ${{ matrix.part == 'modules' }}
        run: pnpm check:unit:modules
      - name: Run release, deployment and process contracts
        if: ${{ matrix.part == 'contracts' }}
        run: pnpm check:contracts

      - name: Upload Telegram gateway failure diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: telegram-gateway-unit-${{ matrix.part }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-artifacts/telegram-deploy-gateway
          if-no-files-found: ignore
          retention-days: 7

  unit:
    name: Unit tests
    needs: [plan, unit-checks]
    if: ${{ always() && contains(fromJSON(needs.plan.outputs.required), 'unit') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require all selected parts
        env:
          RESULT: ${{ needs.unit-checks.result }}
        run: test "$RESULT" = success

  ui:
    needs: plan
    if: ${{ contains(fromJSON(needs.plan.outputs.required), 'ui') }}
    name: UI components
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - name: Set up Platform
        uses: ./.github/actions/setup-platform
        with:
          browsers: chromium webkit
      - name: Run Storybook and browser-engine checks
        run: pnpm check:ui
      - name: Upload browser diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-engines-playwright-${{ github.run_attempt }}
          path: |
            apps/web/test-results/browser-engines
            apps/web/test-results/storybook-imports
          if-no-files-found: ignore
          retention-days: 7

  web-e2e-browser:
    needs: plan
    if: ${{ contains(fromJSON(needs.plan.outputs.required), 'web-e2e') }}
    name: Web browser (${{ matrix.project }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project: [desktop-chromium, mobile-chromium]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - name: Set up Platform
        uses: ./.github/actions/setup-platform
        with:
          browsers: chromium
      - name: Build once and run browser checks on it
        run: pnpm check:web-e2e --project=${{ matrix.project }}
      - name: Upload Playwright diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-e2e-playwright-${{ matrix.project }}-${{ github.run_attempt }}
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore
          retention-days: 7

  web-e2e:
    name: Web E2E
    needs: [plan, web-e2e-browser]
    if: ${{ always() && contains(fromJSON(needs.plan.outputs.required), 'web-e2e') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require all selected parts
        env:
          RESULT: ${{ needs.web-e2e-browser.result }}
        run: test "$RESULT" = success

  integration-checks:
    needs: plan
    if: ${{ contains(fromJSON(needs.plan.outputs.required), 'integration') }}
    name: Integration checks (${{ matrix.part }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        part: [database, enrollments, buyer-journey]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - name: Set up Platform
        uses: ./.github/actions/setup-platform
        with:
          browsers: chromium
      - name: Verify production SQL contracts on an isolated PostgreSQL
        if: ${{ matrix.part == 'database' }}
        run: pnpm production:verify:sql-test
      - name: Verify restore cleanup with synthetic Docker data
        if: ${{ matrix.part == 'database' }}
        run: |
          restore_test_image=ghcr.io/sachkov-inside/postgres:18.4-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
          docker pull "$restore_test_image"
          RESTORE_TEST_IMAGE="$(docker image inspect --format '{{.Id}}' "$restore_test_image")"
          export RESTORE_TEST_IMAGE
          pnpm release:restore:test
      - name: Run isolated integration tests
        if: ${{ matrix.part == 'database' }}
        run: pnpm test:integration:parallel
      - name: Run enrollment browser and real API smoke
        if: ${{ matrix.part == 'enrollments' }}
        run: pnpm smoke:enrollments
      - name: Run buyer journey from product page to access
        if: ${{ matrix.part == 'buyer-journey' }}
        run: pnpm smoke:buyer-journey
      - name: Upload Playwright diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-playwright-${{ matrix.part }}-${{ github.run_attempt }}
          path: |
            apps/web/test-results
            apps/web/.next/dev/logs
          # The dev log lives under the hidden `.next` directory.
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  integration:
    name: Integration
    needs: [plan, integration-checks]
    if: ${{ always() && contains(fromJSON(needs.plan.outputs.required), 'integration') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require all selected parts
        env:
          RESULT: ${{ needs.integration-checks.result }}
        run: test "$RESULT" = success

  integration-serial:
    needs: plan
    if: ${{ contains(fromJSON(needs.plan.outputs.required), 'integration-serial') }}
    name: Integration serial
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - name: Set up Platform
        uses: ./.github/actions/setup-platform
      - name: Run broker, crash and process integration tests one file at a time
        env:
          DEBUG: testcontainers:pull
        run: pnpm test:integration:serial

  compose-development:
    needs: plan
    if: ${{ contains(fromJSON(needs.plan.outputs.required), 'compose-development') }}
    name: Development Compose
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      COMPOSE_PROJECT_NAME: inside-platform-development-${{ github.run_id }}
      LOCAL_SEED_VIEW: checks
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - name: Validate and build profile topology
        run: |
          docker compose --profile storybook config --quiet
          docker compose --profile storybook build
      - name: Run clean stack smoke and write persistence probes
        run: |
          docker compose config --images postgres object-storage mailpit
          docker compose --parallel 1 pull postgres object-storage mailpit
          docker compose up --detach --wait
          bash scripts/compose-stack-smoke.sh
          docker compose exec -T postgres psql \
            --username inside \
            --dbname inside \
            --set ON_ERROR_STOP=1 \
            --command "create schema ci_smoke; create table ci_smoke.persistence_probe (marker text primary key); insert into ci_smoke.persistence_probe values ('survived-restart');"
          docker compose exec -T object-storage sh -ec \
            's3() { curl --fail --silent --show-error --aws-sigv4 aws:amz:us-east-1:s3 --user "$RUSTFS_ACCESS_KEY:$RUSTFS_SECRET_KEY" "$@"; }; s3 --request PUT http://127.0.0.1:9000/inside-ci >/dev/null; s3 --request PUT --data-binary survived-restart http://127.0.0.1:9000/inside-ci/persistence-probe.txt >/dev/null'
      - name: Prove restart persistence and clean shutdown
        run: |
          docker compose down
          docker compose up --detach --wait
          postgres_marker="$(docker compose exec -T postgres psql \
            --username inside \
            --dbname inside \
            --tuples-only \
            --no-align \
            --command "select marker from ci_smoke.persistence_probe;")"
          test "$postgres_marker" = "survived-restart"
          object_storage_marker="$(docker compose exec -T object-storage sh -ec \
            's3() { curl --fail --silent --show-error --aws-sigv4 aws:amz:us-east-1:s3 --user "$RUSTFS_ACCESS_KEY:$RUSTFS_SECRET_KEY" "$@"; }; s3 http://127.0.0.1:9000/inside-ci/persistence-probe.txt')"
          test "$object_storage_marker" = "survived-restart"
          bash scripts/compose-stack-smoke.sh
          docker compose down --remove-orphans
          test -z "$(docker compose ps --all --quiet)"
      - name: Capture failure diagnostics
        if: ${{ failure() }}
        run: |
          bash scripts/compose-failure-diagnostics.sh ci-artifacts/compose-development docker compose
          mkdir -p ci-artifacts/compose-development
          docker compose ps --all >ci-artifacts/compose-development/compose-ps.txt 2>&1 || true
          docker compose logs --no-color --tail 500 >ci-artifacts/compose-development/compose.log 2>&1 || true
      - name: Upload failure diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compose-development-diagnostics-${{ github.run_attempt }}
          path: ci-artifacts/compose-development
          if-no-files-found: ignore
          retention-days: 7
      - name: Remove development stack
        if: ${{ always() }}
        run: docker compose down --volumes --remove-orphans

  compose-production-checks:
    needs: plan
    if: ${{ contains(fromJSON(needs.plan.outputs.required), 'compose-production') }}
    name: Production checks (${{ matrix.part }})
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        part: [cold, cache]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - name: Set up Platform
        uses: ./.github/actions/setup-platform
      - name: Run isolated production smoke
        if: ${{ matrix.part == 'cold' }}
        env:
          PRODUCTION_SMOKE_ARTIFACT_DIR: ci-artifacts/compose-production
        run: pnpm compose:production:smoke
      - name: Build and inspect release images
        if: ${{ matrix.part == 'cold' && github.event_name == 'pull_request' }}
        run: pnpm release:images:smoke
      - name: Prove exact-source production runtime from admitted cache
        if: ${{ matrix.part == 'cache' }}
        env:
          PRODUCTION_SMOKE_ARTIFACT_DIR: ci-artifacts/compose-production-cache
        run: bash scripts/heavy-check.sh bash scripts/production-cache-smoke-ci.sh
      - name: Upload failure diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compose-production-diagnostics-${{ matrix.part }}-${{ github.run_attempt }}
          path: |
            ci-artifacts/compose-production
            ci-artifacts/compose-production-cache
          if-no-files-found: ignore
          retention-days: 7

  foundation-recovery:
    name: Foundation recovery
    needs: plan
    if: ${{ contains(fromJSON(needs.plan.outputs.required), 'compose-production') }}
    uses: ./.github/workflows/foundation-recovery.yml
    with:
      source_sha: ${{ inputs.source_sha || github.sha }}
      base_sha: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
      head_sha: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}

  compose-production:
    name: Production Compose
    needs: [plan, compose-production-checks, foundation-recovery]
    if: ${{ always() && contains(fromJSON(needs.plan.outputs.required), 'compose-production') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require cold and admitted-cache runtime proofs
        env:
          RESULT: ${{ needs.compose-production-checks.result }}
          RECOVERY_RESULT: ${{ needs.foundation-recovery.result }}
        run: test "$RESULT" = success && test "$RECOVERY_RESULT" = success

  telegram:
    needs: plan
    if: ${{ contains(fromJSON(needs.plan.outputs.required), 'telegram') }}
    name: Telegram full checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: ghcr.io/sachkov-inside/postgres:18.4-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
        env:
          POSTGRES_DB: inside_telegram
          POSTGRES_USER: inside
          POSTGRES_PASSWORD: inside
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U inside -d inside_telegram"
          --health-interval 2s --health-timeout 3s --health-retries 30
      rabbitmq:
        image: ghcr.io/sachkov-inside/rabbitmq:4.3-management-alpine@sha256:3ef7f7e89fed709a78f79b8b5f4e30e1312a1d4089da752e23595566d9d61a95
        env:
          RABBITMQ_DEFAULT_USER: telegram_checks
          RABBITMQ_DEFAULT_PASS: telegram_checks
        ports:
          - 5672:5672
          - 15672:15672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      DATABASE_URL: postgresql://inside:inside@127.0.0.1:5432/inside_telegram
      NOTIFICATION_TEST_AMQP_URL: amqp://telegram_checks:telegram_checks@127.0.0.1:5672
      NOTIFICATION_TEST_MANAGEMENT_URL: http://127.0.0.1:15672
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - name: Set up Platform
        uses: ./.github/actions/setup-platform
      - name: Check Telegram with isolated data services
        run: pnpm --filter @inside/telegram check:full
      - name: Build and inspect Telegram production image
        run: |
          docker build --no-cache --file apps/telegram/infra/production/Dockerfile --tag inside-telegram-ci:check .
          test "$(docker run --rm --network none --entrypoint node inside-telegram-ci:check --version)" = "v$(cat .node-version)"
          docker run --rm --network none --entrypoint sh inside-telegram-ci:check -ec '
            test "$(id -u)" = "1000"
            test -f dist/main.js
            node --input-type=module -e "await import(\"./dist/app.module.js\")"
          '

      - name: Upload Telegram gateway failure diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: telegram-gateway-telegram-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-artifacts/telegram-deploy-gateway
          if-no-files-found: ignore
          retention-days: 7

  fullstack-browser:
    name: Full-stack browser (${{ matrix.project }}, ${{ matrix.shard }})
    needs: plan
    if: ${{ contains(fromJSON(needs.plan.outputs.required), 'fullstack') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        project: [desktop-chromium, mobile-chromium]
        shard: [1, 2]
    env:
      COMPOSE_PROJECT_NAME: inside-platform-fullstack-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.project }}-${{ matrix.shard }}
      FULLSTACK_TEST_PROJECT: ${{ matrix.project }}
      FULLSTACK_TEST_SHARD: ${{ matrix.shard }}/2
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Platform
        uses: ./.github/actions/setup-platform
        with:
          browsers: chromium
      - name: Use local development configuration
        run: cp .env.example .env
      - name: Start PostgreSQL and Object Storage
        run: pnpm infra:up
      - name: Run full-stack smoke
        run: pnpm smoke:fullstack
      - name: Capture infrastructure diagnostics
        if: ${{ failure() }}
        run: bash scripts/compose-failure-diagnostics.sh ci-artifacts/fullstack docker compose
      - name: Upload failure diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fullstack-diagnostics-${{ matrix.project }}-${{ matrix.shard }}-${{ github.run_attempt }}
          path: |
            apps/web/playwright-report
            apps/web/test-results
            ci-artifacts/fullstack
            ci-artifacts/evidence
          if-no-files-found: ignore
          retention-days: 7
      - name: Remove infrastructure
        if: ${{ always() }}
        run: docker compose down --volumes --remove-orphans

  fullstack:
    name: Full-stack smoke
    needs: [plan, fullstack-browser]
    if: ${{ always() && contains(fromJSON(needs.plan.outputs.required), 'fullstack') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require all isolated browser profiles
        env:
          PROFILE_RESULT: ${{ needs.fullstack-browser.result }}
        run: test "$PROFILE_RESULT" = success

  ci-gate:
    name: CI Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: ${{ always() }}
    needs:
      - security
      - review-evidence
      - plan
      - docs
      - contracts
      - static
      - unit
      - ui
      - web-e2e
      - integration
      - integration-serial
      - compose-development
      - compose-production
      - telegram
      - fullstack
    steps:
      - name: Require independent review verification
        env:
          REVIEW_RESULT: ${{ needs.review-evidence.result }}
        run: test "$REVIEW_RESULT" = success
      - name: Require security checks for every change
        env:
          SECURITY_RESULT: ${{ needs.security.result }}
        run: test "$SECURITY_RESULT" = success
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Validate selected coverage and actual results
        env:
          CI_EVENT: ${{ inputs.source_sha != '' && 'release' || github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          COVERAGE_JSON: ${{ inputs.coverage_json }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          REVIEW_RESULT: ${{ needs.review-evidence.result }}
          REVIEW_STATUS: ${{ needs.review-evidence.outputs.status }}
          SELECTED_PLAN_SHA256: ${{ needs.plan.outputs.plan_sha256 }}
          JOB_RESULTS: >-
            {
            "plan": {"result": "${{ needs.plan.result }}"},
            "docs": {"result": "${{ needs.docs.result }}"},
            "contracts": {"result": "${{ needs.contracts.result }}"},
            "static": {"result": "${{ needs.static.result }}"},
            "unit": {"result": "${{ needs.unit.result }}"},
            "ui": {"result": "${{ needs.ui.result }}"},
            "web-e2e": {"result": "${{ needs.web-e2e.result }}"},
            "integration": {"result": "${{ needs.integration.result }}"},
            "integration-serial": {"result": "${{ needs.integration-serial.result }}"},
            "compose-development": {"result": "${{ needs.compose-development.result }}"},
            "compose-production": {"result": "${{ needs.compose-production.result }}"},
            "telegram": {"result": "${{ needs.telegram.result }}"},
            "fullstack": {"result": "${{ needs.fullstack.result }}"}
            }
        run: node scripts/ci-coverage-run.mjs gate
      - name: Record trusted source coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-source-evidence-${{ github.run_attempt }}
          path: ci-source-evidence/source-evidence.json
          if-no-files-found: error
          retention-days: 7
