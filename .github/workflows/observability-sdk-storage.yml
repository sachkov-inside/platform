name: Observability native SDK storage

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/observability-sdk-storage.yml
      - .github/actions/setup-platform/**
      - infra/observability/pilot/**
      - scripts/observability-sdk-storage/**
      - scripts/observability-sdk-storage.test.mjs
      - scripts/observability-pilot/**
      - scripts/heavy-check.sh
      - apps/backend/src/**
      - "**/package.json"
      - apps/backend/tsconfig*.json
      - apps/backend/prisma.config.ts
      - apps/backend/prisma/schema.prisma
      - packages/**
      - docs/contracts/**
      - patches/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - tsconfig*.json
      - .node-version
      - .npmrc
      - docs/runbooks/observability-pilot.md

permissions:
  contents: read

concurrency:
  group: observability-sdk-storage-${{ github.event.pull_request.number }}${{ github.run_attempt > 1 && format('-rerun-{0}', github.run_id) || '' }}
  cancel-in-progress: true

env:
  CI: "true"
  PYTHONDONTWRITEBYTECODE: "1"
  PILOT_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
  PILOT_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}

jobs:
  sdk-s3:
    name: Isolated native SDK S3 storage vertical
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pinned Platform toolchain
        uses: ./.github/actions/setup-platform
      - name: Build actual SDK runtime and workspace packages
        timeout-minutes: 6
        run: |
          bash scripts/heavy-check.sh pnpm build:packages
          bash scripts/heavy-check.sh pnpm --filter @inside/backend build
      - name: Verify closed oracles and native child ownership
        timeout-minutes: 2
        run: |
          bash scripts/heavy-check.sh python3 -m unittest discover -s scripts/observability-sdk-storage -p 'test_*.py'
          bash scripts/heavy-check.sh node --test scripts/observability-sdk-storage/emitter.test.mjs
      - name: Bind source and measure disk admission
        timeout-minutes: 1
        run: |
          python3 scripts/observability-sdk-storage/sdk_storage.py admission \
            --output "$RUNNER_TEMP/inside-sdk-storage-private" \
            --metadata "$RUNNER_TEMP/inside-sdk-storage-metadata"
      - name: Run one genuine SDK S3 cold read through pinned storage
        # Existing supervisor retains its unchanged 600-second worker budget.
        timeout-minutes: 22
        run: |
          bash scripts/heavy-check.sh python3 scripts/observability-sdk-storage/sdk_storage.py run \
            --output "$RUNNER_TEMP/inside-sdk-storage-private"
      - name: Recover only the registered disposable project
        if: ${{ always() }}
        timeout-minutes: 5
        run: |
          python3 scripts/observability-sdk-storage/sdk_storage.py recover \
            --output "$RUNNER_TEMP/inside-sdk-storage-private"
      - name: Collect only closed public evidence
        if: ${{ always() }}
        timeout-minutes: 1
        run: |
          python3 scripts/observability-sdk-storage/sdk_storage.py collect \
            --output "$RUNNER_TEMP/inside-sdk-storage-private" \
            --metadata "$RUNNER_TEMP/inside-sdk-storage-metadata" \
            --public "$RUNNER_TEMP/inside-sdk-storage-public"
      - name: Upload curated SDK evidence
        if: ${{ always() }}
        timeout-minutes: 2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: observability-sdk-storage-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/inside-sdk-storage-public
          if-no-files-found: warn
          retention-days: 7
