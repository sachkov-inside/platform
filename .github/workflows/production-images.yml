name: Publish production images

on:
  push:
    branches: [main]

permissions: {}

jobs:
  publish-production-images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      platform-api-digest: ${{ steps.publish-api.outputs.digest }}
      platform-web-digest: ${{ steps.publish-web.outputs.digest }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish API image
        id: publish-api
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          target: api-production
          build-args: SOURCE_REVISION=${{ github.sha }}
          push: true
          provenance: false
          tags: ghcr.io/sachkov-inside/platform-api:${{ github.sha }}
      - name: Build and publish Web image
        id: publish-web
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          target: web-production
          build-args: SOURCE_REVISION=${{ github.sha }}
          push: true
          provenance: false
          tags: ghcr.io/sachkov-inside/platform-web:${{ github.sha }}
      - name: Record exact image references
        run: |
          echo 'API: ghcr.io/sachkov-inside/platform-api@${{ steps.publish-api.outputs.digest }}' >> "$GITHUB_STEP_SUMMARY"
          echo 'Web: ghcr.io/sachkov-inside/platform-web@${{ steps.publish-web.outputs.digest }}' >> "$GITHUB_STEP_SUMMARY"
