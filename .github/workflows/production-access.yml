name: Production access pass

# Проход доступа против production тестовыми identities (#905, #906). Данные Platform он не меняет:
# каждый запрос проходит allowlist до отправки. В Logto проход выпускает one-time token и PAT на
# прогон. Не проверка pull request: запускается вручную и из deploy.yml после выпуска.
on:
  workflow_dispatch:
    inputs:
      deployed-sha:
        description: SHA выпуска, который сейчас в production (для отчёта)
        required: false
        type: string
  workflow_call:
    inputs:
      deployed-sha:
        required: false
        type: string
      # deploy.yml передаёт true: проход после выпуска без SHA красный.
      require-deployed-sha:
        required: false
        type: boolean
        default: false

permissions: {}

concurrency:
  group: platform-production-access-pass
  cancel-in-progress: false

jobs:
  pass:
    name: Production access pass
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: Production
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install browser engine
        run: pnpm --filter @inside/web exec playwright install --with-deps chromium
      - name: Run the production access pass
        env:
          PRODUCTION_ACCESS_LOGTO_APP_ID: ${{ vars.PRODUCTION_ACCESS_LOGTO_APP_ID }}
          PRODUCTION_ACCESS_LOGTO_APP_SECRET: ${{ secrets.PRODUCTION_ACCESS_LOGTO_APP_SECRET }}
          PRODUCTION_ACCESS_MAILBOX: ${{ secrets.PRODUCTION_ACCESS_MAILBOX }}
          PRODUCTION_ACCESS_DEPLOYED_SHA: ${{ inputs.deployed-sha }}
          PRODUCTION_ACCESS_REQUIRE_DEPLOYED_SHA: ${{ inputs.require-deployed-sha }}
          PRODUCTION_ACCESS_REPORT_DIR: ${{ github.workspace }}/ci-artifacts/production-access
        run: pnpm --filter @inside/web test:production-access
      - name: Upload the pass report
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-access-report-${{ github.run_attempt }}
          # Только отчёт клеток: test-results Playwright могут содержать снимки страниц под входом.
          path: |
            ci-artifacts/production-access/report.json
            ci-artifacts/production-access/report.md
          if-no-files-found: warn
          retention-days: 30
