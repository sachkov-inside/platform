# SNI routing only: HAProxy never decrypts application TLS.
global
    log stdout format raw local0
    user haproxy
    group haproxy
    maxconn 2048

defaults
    mode tcp
    log global
    option tcplog
    timeout connect 5s
    timeout client 5m
    timeout server 5m
    timeout client-fin 5s
    timeout server-fin 5s

frontend public_tls
    bind 0.0.0.0:443
    bind [::]:443 v6only
    tcp-request inspect-delay 5s
    tcp-request content accept if { req.ssl_hello_type 1 }
    acl inside_name req.ssl_sni -i sachkov.dev www.sachkov.dev inside.sachkov.dev auth.sachkov.dev
    use_backend inside_origin if inside_name
    default_backend existing_subscription

backend inside_origin
    server origin 201.24.126.23:8443 send-proxy-v2

backend existing_subscription
    # Preserve the existing IP-certificate /sub/ service, including unknown/no SNI.
    server nginx 127.0.0.1:14443 send-proxy-v2
