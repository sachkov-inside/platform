# TLS remains end-to-end between the visitor and Caddy. No certificates here.
global
    log stdout format raw local0
    user haproxy
    group haproxy
    maxconn 2048

defaults
    mode tcp
    log global
    option tcplog
    timeout connect 5s
    timeout client 5m
    timeout server 5m
    timeout client-fin 5s
    timeout server-fin 5s

frontend inside_edge_receiver
    bind 201.24.126.23:8443 accept-proxy
    # Connection rules see the ORIGINAL socket peer, before PROXY overrides src.
    tcp-request connection reject unless { src 185.125.101.90 }
    # Session rules see the claimed client. Never grant the loopback verifier exemption.
    tcp-request session reject if { src -f /etc/inside-entry/non-public-clients.lst }
    default_backend caddy_tls

backend caddy_tls
    # Preserve validated client metadata to the single AMS receiver.
    server amsterdam 147.45.166.174:8443 send-proxy-v2

frontend legacy_public_tls
    bind 201.24.126.23:443
    default_backend caddy_tls

frontend legacy_public_http
    bind 201.24.126.23:80
    mode http
    default_backend amsterdam_http

backend amsterdam_http
    mode http
    server amsterdam 147.45.166.174:80
