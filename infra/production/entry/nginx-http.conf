# Keep ACME HTTP-01 renewal working after regional DNS sends visitors to Aeza.
server {
    listen 80;
    listen [::]:80;
    server_name sachkov.dev www.sachkov.dev inside.sachkov.dev auth.sachkov.dev;
    location ^~ /.well-known/acme-challenge/ {
        proxy_pass http://201.24.126.23;
        proxy_set_header Host $host;
    }
    location / {
        return 308 https://$host$request_uri;
    }
}
