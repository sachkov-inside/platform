name: ${FOUNDATION_LOGTO_PROJECT:?FOUNDATION_LOGTO_PROJECT is required}

x-logto-runtime: &logto-runtime
  build:
    context: ../../identity/logto
    dockerfile: Dockerfile
  image: inside/logto-production:1.44.0-inside.7
  entrypoint: ["/foundation/entrypoint.sh"]
  env_file:
    - ${FOUNDATION_CONFIG_DIR:?FOUNDATION_CONFIG_DIR is required}/logto.env
    - ${FOUNDATION_CONFIG_DIR:?FOUNDATION_CONFIG_DIR is required}/logto-database.env
  networks: [database, edge, identity]
  volumes:
    - ./entrypoint.sh:/foundation/entrypoint.sh:ro
    # Learner MCP access (#938); docs/runbooks/learning-practice-review.md runs it in this container.
    - ./learner-access.mjs:/foundation/learner-access.mjs:ro

services:
  logto-migrations:
    <<: *logto-runtime
    # Seed creates an empty database; alteration brings an existing one to the pinned version.
    command:
      - sh
      - -c
      - npm run cli db seed -- --swe --disable-admin-pwned-password-check && npm run alteration deploy 1.44.0
    restart: "no"

  logto:
    <<: *logto-runtime
    command: ["npm", "start"]
    depends_on:
      logto-migrations:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3001/oidc/.well-known/openid-configuration').then(async r=>{const body=await r.json();if(!r.ok||body.issuer!==process.env.ENDPOINT+'/oidc')process.exit(1)}).catch(()=>process.exit(1))
      interval: 3s
      timeout: 3s
      retries: 40
    ports:
      - 127.0.0.1:${FOUNDATION_LOGTO_LOOPBACK_PORT:?FOUNDATION_LOGTO_LOOPBACK_PORT is required}:3001
    restart: unless-stopped
    stop_grace_period: 30s

networks:
  database:
    external: true
    name: ${FOUNDATION_DATABASE_NETWORK:?FOUNDATION_DATABASE_NETWORK is required}
  edge:
  identity:
    internal: true
