name: ${FOUNDATION_DATABASE_PROJECT:-inside-production-database}

x-postgres-environment: &postgres-environment
  env_file:
    - ${FOUNDATION_PUBLIC_CONFIG_DIR:?FOUNDATION_PUBLIC_CONFIG_DIR is required}/database.env
    - ${FOUNDATION_SECRET_CONFIG_DIR:?FOUNDATION_SECRET_CONFIG_DIR is required}/postgres.env
    - ${FOUNDATION_SECRET_CONFIG_DIR:?FOUNDATION_SECRET_CONFIG_DIR is required}/pgbackrest.env

x-pgbackrest-environment: &pgbackrest-environment
  env_file:
    - ${FOUNDATION_PUBLIC_CONFIG_DIR:?FOUNDATION_PUBLIC_CONFIG_DIR is required}/database.env
    - ${FOUNDATION_SECRET_CONFIG_DIR:?FOUNDATION_SECRET_CONFIG_DIR is required}/pgbackrest.env

x-database-volumes: &database-volumes
  volumes:
    - postgres-data:/var/lib/postgresql
    - postgres-run:/var/run/postgresql
    - pgbackrest-spool:/var/spool/pgbackrest
    - ./pgbackrest.conf:/etc/pgbackrest/pgbackrest.conf:ro

services:
  postgres:
    build:
      context: .
      dockerfile: Dockerfile
    image: inside/postgres-pgbackrest:18.4-2.57.0
    <<: [*postgres-environment, *database-volumes]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 30
    networks: [backup-egress, database]
    restart: unless-stopped
    stop_grace_period: 60s

  pgbackrest:
    build:
      context: .
      dockerfile: Dockerfile
    image: inside/postgres-pgbackrest:18.4-2.57.0
    <<: [*pgbackrest-environment, *database-volumes]
    entrypoint: ["pgbackrest"]
    networks: [backup-egress, database]
    profiles: [operations]
    user: postgres

  restore:
    build:
      context: .
      dockerfile: Dockerfile
    image: inside/postgres-pgbackrest:18.4-2.57.0
    <<: [*pgbackrest-environment, *database-volumes]
    entrypoint: ["inside-pgbackrest-restore"]
    networks: [backup-egress, database]
    profiles: [operations]
    user: root

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: ["server", "--certs-dir", "/certs", "/data"]
    env_file:
      - ${FOUNDATION_PUBLIC_CONFIG_DIR:?FOUNDATION_PUBLIC_CONFIG_DIR is required}/minio.env
    healthcheck:
      test:
        - CMD-SHELL
        - mc alias set local https://127.0.0.1:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" --insecure >/dev/null && mc --insecure ready local
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [database]
    profiles: [fixture]
    volumes:
      - minio-data:/data
      - ${FOUNDATION_MINIO_CERT_DIR:-/var/empty}:/certs:ro

  minio-bootstrap:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/fixture/minio-bootstrap.sh"]
    env_file:
      - ${FOUNDATION_PUBLIC_CONFIG_DIR:?FOUNDATION_PUBLIC_CONFIG_DIR is required}/minio.env
      - ${FOUNDATION_PUBLIC_CONFIG_DIR:?FOUNDATION_PUBLIC_CONFIG_DIR is required}/database.env
    networks: [database]
    profiles: [fixture]
    volumes:
      - ./minio-bootstrap.sh:/fixture/minio-bootstrap.sh:ro

networks:
  backup-egress:
  database:
    name: ${FOUNDATION_DATABASE_NETWORK:-inside-production-database}
    internal: true

volumes:
  minio-data:
  pgbackrest-spool:
  postgres-data:
  postgres-run:
