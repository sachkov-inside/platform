name: ${FOUNDATION_DATABASE_PROJECT:?FOUNDATION_DATABASE_PROJECT is required}

x-database-image: &database-image
  build:
    context: .
    dockerfile: Dockerfile
  image: inside/postgres-pgbackrest:18.4-2.57.0

x-postgres-environment: &postgres-environment
  env_file:
    - ${FOUNDATION_CONFIG_DIR:?FOUNDATION_CONFIG_DIR is required}/database.env
    - ${FOUNDATION_CONFIG_DIR:?FOUNDATION_CONFIG_DIR is required}/postgres.env
    - ${FOUNDATION_CONFIG_DIR:?FOUNDATION_CONFIG_DIR is required}/logto-database.env
    - ${FOUNDATION_CONFIG_DIR:?FOUNDATION_CONFIG_DIR is required}/pgbackrest.env

x-pgbackrest-environment: &pgbackrest-environment
  env_file:
    - ${FOUNDATION_CONFIG_DIR:?FOUNDATION_CONFIG_DIR is required}/database.env
    - ${FOUNDATION_CONFIG_DIR:?FOUNDATION_CONFIG_DIR is required}/pgbackrest.env

x-database-volumes: &database-volumes
  volumes:
    - postgres-data:/var/lib/postgresql
    - postgres-run:/var/run/postgresql
    - pgbackrest-spool:/var/spool/pgbackrest
    - ./pgbackrest.conf:/etc/pgbackrest/pgbackrest.conf:ro

services:
  postgres:
    <<: [*database-image, *postgres-environment, *database-volumes]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 30
    networks: [backup-egress, database]
    restart: unless-stopped
    stop_grace_period: 60s

  pgbackrest:
    <<: [*database-image, *pgbackrest-environment, *database-volumes]
    entrypoint: ["pgbackrest"]
    networks: [backup-egress, database]
    profiles: [operations]
    user: postgres

  restore:
    <<: [*database-image, *pgbackrest-environment, *database-volumes]
    entrypoint: ["inside-pgbackrest-restore"]
    environment:
      INSIDE_RESTORE_VOLUME: ${FOUNDATION_POSTGRES_VOLUME:?FOUNDATION_POSTGRES_VOLUME is required}
    networks: [backup-egress, database]
    profiles: [operations]
    user: root

networks:
  backup-egress:
  database:
    name: ${FOUNDATION_DATABASE_NETWORK:?FOUNDATION_DATABASE_NETWORK is required}
    internal: true

volumes:
  pgbackrest-spool:
  postgres-data:
    name: ${FOUNDATION_POSTGRES_VOLUME:?FOUNDATION_POSTGRES_VOLUME is required}
  postgres-run:
