name: ${FOUNDATION_DATABASE_PROJECT:-inside-production-database}

x-postgres-environment: &postgres-environment
  env_file:
    - ${FOUNDATION_CONFIG_DIR:-/etc/inside/foundation}/database.env
    - ${FOUNDATION_CONFIG_DIR:-/etc/inside/foundation}/postgres.env
    - ${FOUNDATION_CONFIG_DIR:-/etc/inside/foundation}/logto-database.env
    - ${FOUNDATION_CONFIG_DIR:-/etc/inside/foundation}/pgbackrest.env

x-pgbackrest-environment: &pgbackrest-environment
  env_file:
    - ${FOUNDATION_CONFIG_DIR:-/etc/inside/foundation}/database.env
    - ${FOUNDATION_CONFIG_DIR:-/etc/inside/foundation}/pgbackrest.env

x-database-volumes: &database-volumes
  volumes:
    - postgres-data:/var/lib/postgresql
    - postgres-run:/var/run/postgresql
    - pgbackrest-spool:/var/spool/pgbackrest
    - ./pgbackrest.conf:/etc/pgbackrest/pgbackrest.conf:ro

services:
  postgres:
    build:
      context: .
      dockerfile: Dockerfile
    image: inside/postgres-pgbackrest:18.4-2.57.0
    <<: [*postgres-environment, *database-volumes]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 30
    networks: [backup-egress, database]
    restart: unless-stopped
    stop_grace_period: 60s

  pgbackrest:
    build:
      context: .
      dockerfile: Dockerfile
    image: inside/postgres-pgbackrest:18.4-2.57.0
    <<: [*pgbackrest-environment, *database-volumes]
    entrypoint: ["pgbackrest"]
    networks: [backup-egress, database]
    profiles: [operations]
    user: postgres

  restore:
    build:
      context: .
      dockerfile: Dockerfile
    image: inside/postgres-pgbackrest:18.4-2.57.0
    <<: [*pgbackrest-environment, *database-volumes]
    entrypoint: ["inside-pgbackrest-restore"]
    networks: [backup-egress, database]
    profiles: [operations]
    user: root

networks:
  backup-egress:
  database:
    name: ${FOUNDATION_DATABASE_NETWORK:-inside-production-database}
    internal: true

volumes:
  pgbackrest-spool:
  postgres-data:
  postgres-run:
