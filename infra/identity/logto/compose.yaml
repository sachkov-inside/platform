name: inside-identity-proof

services:
  logto:
    build:
      context: .
      dockerfile: Dockerfile
    image: inside/logto-proof:1.46.0-inside.16
    depends_on:
      logto-postgres:
        condition: service_healthy
    entrypoint:
      [
        "sh",
        "-c",
        "npm run cli db seed -- --swe --disable-admin-pwned-password-check && npm run alteration deploy 1.46.0 && npm start",
      ]
    environment:
      ADMIN_ENDPOINT: https://identity.inside.localhost:${IDENTITY_PROOF_LOGTO_ADMIN_PORT:-3302}
      DB_URL: postgres://logto:inside-proof@logto-postgres:5432/logto
      ENDPOINT: https://identity.inside.localhost:${IDENTITY_PROOF_LOGTO_PORT:-3301}
      HTTPS_CERT_PATH: /proof-tls/certificate.pem
      HTTPS_KEY_PATH: /proof-tls/private-key.pem
      TRUST_PROXY_HEADER: "0"
    ports:
      - "127.0.0.1:${IDENTITY_PROOF_LOGTO_PORT:-3301}:3001"
      - "127.0.0.1:${IDENTITY_PROOF_LOGTO_ADMIN_PORT:-3302}:3002"
    volumes:
      - ../../../.identity-proof/tls:/proof-tls:ro

  logto-postgres:
    image: public.ecr.aws/docker/library/postgres:17.12-alpine@sha256:34261f594522cf41dfcb76aefd42b9d201098b0e6b23c9c68733f169e4218b6f
    environment:
      POSTGRES_DB: logto
      POSTGRES_PASSWORD: inside-proof
      POSTGRES_USER: logto
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logto -d logto"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - logto-postgres-data:/var/lib/postgresql/data

  mailpit:
    image: ghcr.io/axllent/mailpit:v1.33.1@sha256:aef2aacc11f075ec0fb6874275ee4a421e688e11a96ebb296134d1735c7761ce
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: "100"
    ports:
      - "127.0.0.1:${IDENTITY_PROOF_SMTP_PORT:-1026}:1025"
      - "127.0.0.1:${IDENTITY_PROOF_MAILPIT_PORT:-8026}:8025"
    volumes:
      - mailpit-data:/data

volumes:
  logto-postgres-data:
  mailpit-data:
