packages:
  - apps/*
  - packages/*
  - docs/contracts
engineStrict: true
saveExact: true
strictPeerDependencies: true
minimumReleaseAge: 1440
allowBuilds:
  "@prisma/engines": true
  "@scarf/scarf": false
  cpu-features: false
  esbuild: true
  prisma: true
  protobufjs: false
  ssh2: false
# @nestjs/swagger 12 declares an optional typescript ^5.5.0 || ^6.0.0 peer for its CLI compiler plugin, the
# only code of it that imports the TypeScript API. Platform never loads that plugin
# (scripts/toolchain-contract.test.mjs), so its runtime accepts TypeScript 7.
peerDependencyRules:
  allowedVersions:
    "@nestjs/swagger>typescript": "7"
# #1023 / #1580: bound IPC history, stop abandoned Vitest and decode non-ASCII test paths.
patchedDependencies:
  "@storybook/addon-vitest@10.6.7": patches/@storybook__addon-vitest@10.6.7.patch
  # #1160: preserve unique Playwright trace names. Remove when upstream scopes chunk names per context.
  "@vitest/browser-playwright@5.1.0": patches/@vitest__browser-playwright@5.1.0.patch
  # #1315: reject failed pull streams and inspect the acquired image. Remove when upstream guarantees both.
  testcontainers@12.2.1: patches/testcontainers@12.2.1.patch
  # #1747: decode external file URLs for mock lookup. Remove when Vitest normalizes these identities.
  vitest@5.1.0: patches/vitest@5.1.0.patch
# Security fixes for development tools whose stable parents still exclude the fixed major.
# Remove each entry when that parent admits glob >=14.0.2 or minimatch >=11.0.1.
overrides:
  "archiver-utils>glob": 14.0.3
  "@joshwooding/vite-plugin-react-docgen-typescript>glob": 14.0.3
  "@ts-morph/common>minimatch": 11.0.1
