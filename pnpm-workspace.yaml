packages:
  - apps/*
  - packages/*
engineStrict: true
saveExact: true
strictPeerDependencies: true
minimumReleaseAge: 1440
allowBuilds:
  '@prisma/engines': true
  '@scarf/scarf': false
  cpu-features: false
  esbuild: true
  prisma: true
  protobufjs: false
  ssh2: false
# @nestjs/swagger 12 declares an optional typescript ^5 || ^6 peer for its CLI compiler plugin, the
# only code of it that imports the TypeScript API. Platform never loads that plugin
# (scripts/toolchain-contract.test.mjs), so its runtime accepts TypeScript 7.
peerDependencyRules:
  allowedVersions:
    "@nestjs/swagger>typescript": "7"
# Security overrides only: each replaces an exact transitive pin that has a published advisory and
# no fixed release of its parent on our major. Remove an entry once the named parent ships the fix
# (docs/runbooks/dependency-updates.md, Security overrides).
overrides:
  # prisma 7.10.0 pins mysql2 3.15.3 and, through @prisma/config, deepmerge-ts 7.1.5.
  mysql2: 3.24.4
  deepmerge-ts: 8.0.2
