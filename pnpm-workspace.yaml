packages:
  - apps/*
  - packages/*
  - docs/contracts
engineStrict: true
saveExact: true
strictPeerDependencies: true
minimumReleaseAge: 1440
allowBuilds:
  "@prisma/engines": true
  "@scarf/scarf": false
  cpu-features: false
  esbuild: true
  prisma: true
  protobufjs: false
  ssh2: false
# @nestjs/swagger 12 declares an optional typescript ^5.5.0 || ^6.0.0 peer for its CLI compiler plugin, the
# only code of it that imports the TypeScript API. Platform never loads that plugin
# (scripts/toolchain-contract.test.mjs), so its runtime accepts TypeScript 7.
peerDependencyRules:
  allowedVersions:
    "@nestjs/swagger>typescript": "7"
# #1023 / #1580: bound IPC history, stop abandoned Vitest and decode non-ASCII test paths.
patchedDependencies:
  "@storybook/addon-vitest@10.6.1": patches/@storybook__addon-vitest@10.6.1.patch
  # #1160: preserve unique Playwright trace names. Remove when upstream scopes chunk names per context.
  "@vitest/browser-playwright@4.1.11": patches/@vitest__browser-playwright@4.1.11.patch
  # #1315: reject failed pull streams and inspect the acquired image. Remove when upstream guarantees both.
  testcontainers@12.2.0: patches/testcontainers@12.2.0.patch
  # #1747: decode external file URLs for mock lookup. Remove when Vitest normalizes these identities.
  vitest@4.1.11: patches/vitest@4.1.11.patch
# Security overrides only: each replaces a transitive dependency that its parent pins exactly or by a
# range that excludes the fix of a published advisory, while the parent has no fixed release on our major. Remove an entry once the named parent ships the fix
# (docs/runbooks/dependency-updates.md, Security overrides).
overrides:
  # prisma 7.10.0 pins mysql2 3.15.3 and, through @prisma/config, deepmerge-ts 7.1.5.
  mysql2: 3.24.4
  deepmerge-ts: 8.0.2
  # #1889: @fastify/static 10.1.8 (latest) depends on glob ^13; glob 14.0.3 also brings minimatch 11.
  # Remove when a stable @fastify/static release depends on glob >= 14.0.2.
  "@fastify/static>glob": 14.0.3
